<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FEF6D5">
<title>خطبة طارق بن زياد — الدرس التاسع</title>
<meta name="description" content="عرض تقديمي تفاعلي عن الأدب الأندلسي: من خطبة طارق بن زياد عند فتح الأندلس">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet"></noscript>
<style>
/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--deep);}
body{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none;}
img{display:block;max-width:100%;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ===== TOKENS — Butter Yellow / Wine Red / Dusty Coral ===== */
:root{
  --ink:var(--deep);--paper:#ffffff;--paper-dim:#FCE9A0;--sand:#FADE65;
  --clay:#FADE65;--amber:#FADE65;--gold:#FADE65;--gold-soft:#FADE65;
  --line:rgba(121,36,71,.1);
  --f-ar:'Tajawal','IBM Plex Sans Arabic','Noto Sans Arabic',sans-serif;
  --f-ui:'Tajawal','IBM Plex Sans Arabic',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);--ease-soft:cubic-bezier(.16,.84,.44,1);--ease-cine:cubic-bezier(.65,.05,.2,1);
  --corner:none;--sep:none;--pat:none;
}

/* ===== STAGE ===== */
#stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--deep);}
#canvas{--ts:1;position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);background:var(--ink);overflow:hidden;container-type:inline-size;box-shadow:0 20px 60px rgba(121,36,71,0.25);}

/* type scale (affected by text-size control via --ts) */
.t-xl{font-size:calc(clamp(1.8rem,5cqw,4.2rem)*var(--ts));}
.t-md{font-size:calc(clamp(1.05rem,2.4cqw,1.9rem)*var(--ts));}
.t-sm{font-size:calc(clamp(.95rem,2cqw,1.6rem)*var(--ts));}

/* ===== SLIDES ===== */
.slide{position:absolute;inset:0;display:flex;align-items:var(--ai,center);justify-content:var(--jc,center);padding:5.8cqw 4.2cqw 6.8cqw;color:var(--paper);opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;}
.slide:not(.is-active):not(.is-leaving){content-visibility:hidden;}
.slide.is-active{opacity:1;visibility:visible;pointer-events:auto;z-index:5;}
.slide.is-leaving{z-index:4;}
.slide.is-settled{animation:none!important;}

.slide-bg{position:absolute;inset:-3%;z-index:0;background:var(--ink);transition:transform .9s var(--ease-soft);contain:strict;}
.bg-motion{position:absolute;inset:0;}
.is-active .bg-motion,.is-leaving .bg-motion{will-change:transform;}
.slide-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(var(--bb,5px)) saturate(.95) sepia(.18);opacity:0;transition:opacity .8s var(--ease);}
.slide-bg img.is-loaded{opacity:1;}
.slide-bg .fallback{position:absolute;inset:0;background:linear-gradient(160deg,var(--deep),var(--ink) 58%,#F5D0BE 140%);}
.slide-bg .overlay{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 108%,rgba(250,222,101,.36),transparent 60%),radial-gradient(ellipse at center,transparent 45%,rgba(254,246,213,.55)),linear-gradient(180deg,rgba(254,246,213,.5),rgba(254,246,213,.7));}
.slide-bg::after{content:'';position:absolute;inset:0;background:var(--pat) 0 0/5.6cqw;opacity:.055;pointer-events:none;}
.is-active .slide-bg.drift .bg-motion,.is-leaving .slide-bg.drift .bg-motion{animation:driftA 28s ease-out forwards;}
.slide:nth-child(even) .slide-bg.drift .bg-motion{animation-name:driftB!important;}
@keyframes driftA{from{scale:1.14;translate:1% .6%;}to{scale:1.04;translate:-1% -.6%;}}
@keyframes driftB{from{scale:1.03;translate:-1% 0;}to{scale:1.13;translate:1% -.8%;}}

/* floating card */
.slide-body,.speech-frame{
  position:relative;z-index:2;width:var(--cw,80cqw);max-width:100%;max-height:100%;
  overflow:hidden auto;scrollbar-width:none;touch-action:pan-y;
  display:flex;flex-direction:column;justify-content:center!important;gap:.9cqw;
  padding:2.6cqw 3.4cqw 2.8cqw!important;border-radius:1.5cqw;
  background:linear-gradient(155deg,rgba(254,246,213,.58),rgba(254,246,213,.78) 62%,rgba(254,246,213,.5));
  border:1px solid rgba(121,36,71,.3);
  box-shadow:0 2.4cqw 6cqw rgba(121,36,71,0.23),inset 0 1px 0 rgba(121,36,71,.16);
}
.slide-body::-webkit-scrollbar,.speech-frame::-webkit-scrollbar{display:none;}
.slide-body::before,.slide-body::after,.speech-frame::before,.speech-frame::after{content:'';position:absolute;width:4cqw;height:4cqw;background:var(--corner) center/contain no-repeat;opacity:.8;pointer-events:none;}
.slide-body::before,.speech-frame::before{top:.7cqw;right:.7cqw;transform:scaleX(-1);}
.slide-body::after,.speech-frame::after{bottom:.7cqw;left:.7cqw;transform:scaleY(-1);}

.kicker{font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);display:flex;align-items:center;gap:.6em;font-size:calc(clamp(.9rem,1.7cqw,1.35rem)*var(--ts));}
.kicker::before{content:'';width:.5em;height:.5em;background:var(--amber);transform:rotate(45deg);flex:none;}
.slide h1,.slide h2{font-family:var(--f-ar);font-weight:700;line-height:1.35;color:#ffffff;}
.slide-body h2::after,.slide-body h1::after{content:'';display:block;width:15cqw;height:1.1cqw;margin-top:.5cqw;background:var(--sep) right center/100% 100% no-repeat;}
.slide p{font-family:var(--f-ar);line-height:1.85;color:var(--paper-dim);max-width:none!important;}
.slide .lede{color:var(--paper);}
.stack{display:flex;flex-direction:column;gap:1cqw;max-width:none!important;}
.slide-body .card-grid{max-width:none!important;}

.lay-wide h2{font-size:calc(clamp(1.6rem,4.2cqw,3.4rem)*var(--ts));}
.reveal{opacity:0;transform:translateY(1.4cqw);}
.is-active .reveal{animation:revealUp .85s var(--ease-soft) forwards;}
.is-active .reveal:nth-child(1){animation-delay:.3s;}
.is-active .reveal:nth-child(2){animation-delay:.42s;}
.is-active .reveal:nth-child(3){animation-delay:.56s;}
.is-active .reveal:nth-child(4){animation-delay:.7s;}
.is-active .reveal:nth-child(5){animation-delay:.84s;}
.is-active .reveal:nth-child(6){animation-delay:.98s;}
@keyframes revealUp{to{opacity:1;transform:none;}}
.is-active .slide-body,.is-active .speech-frame{animation:cardIn 1.1s var(--ease-soft) .15s both;}
@keyframes cardIn{from{opacity:0;transform:translateY(2.4cqw) scale(.985);}to{opacity:1;transform:none;}}

/* interactive terms */
.term{cursor:pointer;color:#ffffff;font-weight:700;border-radius:.15em;padding:0 .08em;background:linear-gradient(rgba(208,87,85,.3),rgba(208,87,85,.3)) 0 100%/100% .12em no-repeat;transition:background-size .25s var(--ease),color .2s;}
.term:hover,.term:focus-visible{color:var(--gold-soft);background-size:100% 100%;outline:0;}

/* cover */
.slide-cover{--ai:flex-end;padding-bottom:10.4cqw;}
.slide-cover .slide-body{align-items:flex-start;padding:3.2cqw 4.4cqw 3.4cqw!important;background:linear-gradient(0deg,rgba(254,246,213,.84),rgba(254,246,213,.5));}
.slide-cover .eyebrow{font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:calc(clamp(.9rem,1.7cqw,1.35rem)*var(--ts));}
.slide-cover h1{font-size:calc(clamp(2.6rem,8cqw,6.8rem)*var(--ts));text-shadow:0 .4cqw 2cqw rgba(121,36,71,0.16);}
.slide-cover .sub{font-family:var(--f-ar);color:var(--paper);font-size:calc(clamp(1.1rem,2.8cqw,2.2rem)*var(--ts));max-width:none;}
.slide-cover .yr{font-family:var(--f-ui);font-weight:500;color:var(--gold-soft);font-size:calc(clamp(.9rem,1.5cqw,1.2rem)*var(--ts));letter-spacing:.06em;}
.start-hint{position:absolute;z-index:3;bottom:6.9cqw;left:50%;transform:translateX(-50%);font-family:var(--f-ui);color:var(--paper-dim);font-size:clamp(.72rem,1.1cqw,.9rem);display:flex;align-items:center;gap:.5em;opacity:.75;}
.chev{width:.6em;height:.6em;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);animation:bob 1.6s ease-in-out infinite;}
.slide:not(.is-active):not(.is-leaving) .chev{animation:none;}
@keyframes bob{0%,100%{transform:rotate(-45deg) translateY(0);}50%{transform:rotate(-45deg) translateY(4px);}}

/* speech slides */
.speech-frame{box-shadow:0 2.4cqw 6cqw rgba(121,36,71,0.23),inset 0 1px 0 rgba(121,36,71,.16),inset -.5cqw 0 0 rgba(121,36,71,0.25);background:linear-gradient(155deg,rgba(254,246,213,.66),rgba(254,246,213,.86) 62%,rgba(254,246,213,.55));}
.speech-label{font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:calc(clamp(.9rem,1.6cqw,1.3rem)*var(--ts));margin-bottom:.8cqw;display:flex;align-items:center;gap:.6em;}
.speech-label::before{content:'';width:.5em;height:.5em;background:var(--amber);transform:rotate(45deg);flex:none;}
.speech-text{font-family:var(--f-ar);line-height:1.95;color:var(--paper);}
.speech-hero{font-size:calc(clamp(2.1rem,6cqw,4.8rem)*var(--ts));font-weight:700;line-height:1.4;color:#ffffff;}
.speech-body{font-size:calc(clamp(1.2rem,2.4cqw,1.95rem)*var(--ts));}
.speech-note{font-family:var(--f-ar);margin-top:1.1cqw;padding-top:.9cqw;border-top:1px solid var(--line);color:var(--sand);font-size:calc(clamp(.95rem,1.85cqw,1.5rem)*var(--ts));}
.tag-word{display:inline-flex;font-family:var(--f-ui);font-size:.55em;font-weight:700;color:var(--deep);background:var(--gold-soft);padding:.1em .7em;border-radius:999px;vertical-align:middle;margin-inline-start:.5em;}

/* cards */
.card-grid{display:grid;gap:1cqw;}
.cards-2{grid-template-columns:repeat(2,1fr);}
.card{background:rgba(121,36,71,.07);border:1px solid var(--line);border-radius:1cqw;padding:1.2cqw 1.5cqw;display:flex;flex-direction:column;gap:.4cqw;}
.card .num{font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:calc(clamp(1.1rem,2.6cqw,2rem)*var(--ts));}
.card h3{font-family:var(--f-ar);font-weight:700;color:#ffffff;font-size:calc(clamp(1.1rem,2.2cqw,1.75rem)*var(--ts));}
.slide .card p{font-size:calc(clamp(.95rem,1.6cqw,1.4rem)*var(--ts));line-height:1.7;color:var(--paper-dim);}
.rhet-card{cursor:pointer;transition:border-color .25s var(--ease),background .25s var(--ease),transform .25s var(--ease);}
.rhet-card:hover{border-color:var(--amber);background:rgba(208,87,85,.16);transform:translateY(-.2cqw);}
.rhet-card .q{font-family:var(--f-ar);font-weight:700;color:#ffffff;font-size:calc(clamp(1.15rem,2.3cqw,1.8rem)*var(--ts));line-height:1.6;}
.rhet-card .hint-open{font-family:var(--f-ui);color:var(--gold-soft);font-size:calc(clamp(.72rem,1.1cqw,.9rem)*var(--ts));}

/* vocab */
.vocab-tabs{display:flex;gap:.8cqw;flex-wrap:wrap;}
.vocab-tab{font-family:var(--f-ui);font-weight:700;font-size:calc(clamp(.9rem,1.6cqw,1.3rem)*var(--ts));color:var(--paper-dim);padding:.5cqw 1.5cqw;border:1px solid var(--line);border-radius:999px;transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);}
.vocab-tab.is-on{background:var(--amber);color:var(--deep);border-color:var(--amber);}
.vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9cqw;}
.vocab-item{display:none;}.vocab-item.is-on{display:block;}
.vocab-pill{width:100%;text-align:right;border:1px solid var(--line);border-radius:.9cqw;padding:.8cqw 1.2cqw;font-family:var(--f-ar);font-weight:700;font-size:calc(clamp(1.1rem,2.1cqw,1.7rem)*var(--ts));color:#ffffff;background:rgba(121,36,71,.07);transition:background .2s,border-color .2s;}
.vocab-pill:hover,.vocab-pill:focus-visible{background:rgba(208,87,85,.26);border-color:var(--amber);outline:0;}

/* summary */
.slide[data-id=summary] .slide-body{text-align:center;align-items:center;}
.slide[data-id=summary] h2::after{margin-inline:auto;}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.7cqw;}
.chain span{font-family:var(--f-ui);font-weight:700;font-size:calc(clamp(.9rem,1.7cqw,1.35rem)*var(--ts));color:var(--paper);padding:.45cqw 1.2cqw;border:1px solid var(--line);border-radius:999px;background:rgba(121,36,71,.07);}
.chain i{color:var(--amber);font-style:normal;}

/* ===== START SCREEN ===== */
#startScreen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:var(--ink);transition:opacity .9s var(--ease),visibility .9s;}
#startScreen.is-hidden{opacity:0;visibility:hidden;pointer-events:none;}
#startBg .slide-bg{--bb:3px;}
#startBg .bg-motion{animation:driftA 32s ease-in-out infinite alternate;}
#startScreen.is-hidden #startBg .bg-motion{animation:none;}
#startBg .overlay{background:radial-gradient(90% 60% at 50% 100%,rgba(250,222,101,.5),transparent 65%),radial-gradient(ellipse at center,rgba(254,246,213,.2) 20%,rgba(254,246,213,.75)),linear-gradient(180deg,rgba(254,246,213,.55),rgba(254,246,213,.6));}
#startScreen::before,#startScreen::after{content:'';position:absolute;left:0;right:0;height:5cqw;background:var(--deep);z-index:4;transform:scaleY(0);animation:bar 1.3s var(--ease-cine) .1s forwards;}
#startScreen::before{top:0;transform-origin:top;}#startScreen::after{bottom:0;transform-origin:bottom;}
@keyframes bar{to{transform:scaleY(1);}}
.st-frame{position:absolute;inset:6.6cqw 3.6cqw;border:1px solid rgba(121,36,71,.28);z-index:2;pointer-events:none;}
.st-frame i{position:absolute;width:5cqw;height:5cqw;background:var(--corner) center/contain no-repeat;}
.st-frame i:nth-child(1){top:-.3cqw;right:-.3cqw;transform:scaleX(-1);}
.st-frame i:nth-child(2){top:-.3cqw;left:-.3cqw;}
.st-frame i:nth-child(3){bottom:-.3cqw;right:-.3cqw;transform:scale(-1,-1);}
.st-frame i:nth-child(4){bottom:-.3cqw;left:-.3cqw;transform:scaleY(-1);}
.st-in{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;padding:0 9cqw;}
.st-in>*{opacity:0;animation:revealUp 1.1s var(--ease-soft) forwards;}
.st-in>:nth-child(1){animation-delay:.7s;}.st-in>:nth-child(2){animation-delay:.95s;}.st-in>:nth-child(3){animation-delay:1.2s;}.st-in>:nth-child(4){animation-delay:1.45s;}.st-in>:nth-child(5){animation-delay:1.7s;}
#startScreen .eyebrow{font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:clamp(.9rem,1.7cqw,1.35rem);display:flex;align-items:center;gap:.8em;}
#startScreen .eyebrow::before,#startScreen .eyebrow::after{content:'';width:.5em;height:.5em;background:var(--amber);transform:rotate(45deg);}
#startScreen h1{font-family:var(--f-ar);font-weight:700;line-height:1.3;color:#ffffff;font-size:clamp(2.8rem,8.4cqw,7.4rem);text-shadow:0 .5cqw 3cqw rgba(121,36,71,0.20);}
#startScreen .sub{font-family:var(--f-ar);color:var(--paper);font-size:clamp(1.1rem,2.6cqw,2.1rem);line-height:1.8;}
.st-route{display:flex;align-items:center;gap:.9cqw;font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:clamp(.8rem,1.4cqw,1.15rem);}
.st-route i{font-style:normal;color:var(--amber);}
#startBtn{margin-top:.8cqw;font-family:var(--f-ui);font-weight:700;font-size:clamp(1rem,1.9cqw,1.5rem);color:var(--deep);background:linear-gradient(135deg,var(--gold-soft),var(--amber) 70%);padding:.8em 2.6em;border-radius:999px;display:inline-flex;align-items:center;gap:.7em;box-shadow:0 .6cqw 3cqw rgba(121,36,71,0.18);transition:transform .25s var(--ease),box-shadow .25s;}
#startBtn:hover,#startBtn:focus-visible{transform:translateY(-3px);box-shadow:0 .8cqw 4cqw rgba(121,36,71,0.27);outline:0;}
#startBtn svg{width:1.1em;height:1.1em;}

/* ===== PROGRESS / ROUTE ===== */
#pbar{position:absolute;top:0;left:0;right:0;height:.3cqw;z-index:41;background:rgba(121,36,71,.1);}
#pbar i{position:absolute;inset:0;background:linear-gradient(270deg,var(--clay),var(--amber),var(--gold-soft));transform-origin:right;transform:scaleX(0);transition:transform .8s var(--ease);}
#route{position:absolute;top:1.3cqw;left:50%;transform:translateX(-50%);z-index:40;width:78cqw;display:flex;justify-content:space-between;pointer-events:none;transition:opacity .5s var(--ease);}
.rt-track{position:absolute;left:6cqw;right:6cqw;top:.55cqw;height:2px;background:rgba(121,36,71,.25);border-radius:2px;}
.rt-fill{position:absolute;inset:0;background:linear-gradient(270deg,var(--amber),var(--gold-soft));transform-origin:right;transform:scaleX(0);transition:transform .9s var(--ease);}
.rt-mark{position:absolute;top:50%;right:0;width:1.2cqw;height:1.2cqw;background:var(--gold-soft);box-shadow:0 0 1.4cqw var(--amber);transform:translate(50%,-50%) rotate(45deg);transition:transform .9s var(--ease);}
.rt-node{position:relative;pointer-events:auto;width:12cqw;display:flex;flex-direction:column;align-items:center;gap:.5cqw;font-family:var(--f-ui);font-weight:700;font-size:clamp(.7rem,1.2cqw,1rem);color:rgba(121,36,71,.6);transition:color .4s;}
.rt-node i{width:1cqw;height:1cqw;border-radius:50%;border:2px solid rgba(121,36,71,.5);background:var(--deep);transition:background-color .4s,border-color .4s;}
.rt-node.is-on{color:var(--paper);}
.rt-node.is-on i{background:var(--amber);border-color:var(--gold-soft);}
.rt-node.is-cur{color:var(--gold-soft);}

/* ===== CONTROLS ===== */
#controls{position:absolute;bottom:1.2cqw;left:50%;transform:translate(-50%,0);z-index:40;display:flex;align-items:center;gap:.3cqw;background:rgba(254,246,213,.88);border:1px solid var(--line);border-radius:999px;padding:.4cqw .8cqw;transition:opacity .5s var(--ease),transform .5s var(--ease);}
#controls.is-dim{opacity:0;transform:translate(-50%,10px);pointer-events:none;}
.ctl-btn{width:clamp(30px,3.3cqw,44px);height:clamp(30px,3.3cqw,44px);display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--paper);font-family:var(--f-ui);font-weight:700;font-size:clamp(.72rem,1.2cqw,.95rem);transition:background .2s var(--ease);}
.ctl-btn:hover,.ctl-btn:focus-visible{background:rgba(121,36,71,.16);outline:0;}
.ctl-btn svg{width:46%;height:46%;}
.ctl-btn.is-off{color:var(--sand);opacity:.7;}
.ctl-sep{width:1px;height:1.4cqw;background:var(--line);margin:0 .3cqw;}
#slideCounter{font-family:var(--f-ui);font-weight:700;font-size:clamp(.72rem,1.15cqw,.92rem);color:var(--paper-dim);padding:0 .7cqw;min-width:3.8em;text-align:center;}
body:not(.started) #controls,body:not(.started) #route,body:not(.started) #pbar{opacity:0;pointer-events:none;}
body.presenter #controls,body.presenter #route{opacity:0!important;pointer-events:none!important;visibility:hidden;}
#pmini{display:none;position:absolute;bottom:1.1cqw;left:1.4cqw;z-index:41;font-family:var(--f-ui);font-weight:700;font-size:clamp(.72rem,1.1cqw,.9rem);color:var(--paper-dim);background:rgba(254,246,213,.55);padding:.4cqw 1.1cqw;border:1px solid var(--line);border-radius:999px;}
body.presenter #pmini{display:block;}
body.presenter .slide{padding:3cqw 3cqw 4cqw;}
body.presenter .slide-body,body.presenter .speech-frame{width:min(94cqw,calc(var(--cw,80cqw)*1.2));}
body.presenter .slide-cover{padding-bottom:6cqw;}
body.presenter .start-hint{display:none;}

#termHint{position:absolute;bottom:6.8cqw;left:50%;transform:translate(-50%,6px);z-index:35;background:rgba(254,246,213,.88);border:1px solid var(--line);color:var(--paper);font-family:var(--f-ui);font-weight:500;font-size:clamp(.75rem,1.2cqw,.95rem);padding:.55em 1.3em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .45s var(--ease),transform .45s var(--ease);}
#termHint.is-on{opacity:1;transform:translate(-50%,0);}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:52;pointer-events:none;opacity:.7;}

/* ===== SLIDE: إنجازات طارق (potret di tengah, 5 polaroid mengitari) ===== */
.slide-orbit .slide-body{width:100%;height:100%;max-height:none;padding:0!important;gap:0;background:none;border:0;box-shadow:none;overflow:visible;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
.slide-orbit .slide-body::after{display:none;}
.slide-orbit .slide-body::before{content:'';position:absolute;left:50%;top:50%;right:auto;bottom:auto;width:72cqw;height:32cqw;translate:-50% -50%;transform:none;background:none;border:1px dashed rgba(121,36,71,.3);border-radius:50%;opacity:1;}
.orbit-core{position:absolute;left:50%;top:calc(50% + 2.2cqw);translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:.9cqw;z-index:2;}
.orbit-arch{width:10.5cqw;height:14cqw;border-radius:999px 999px 1cqw 1cqw;overflow:hidden;border:.25cqw solid var(--gold-soft);background:linear-gradient(160deg,var(--deep),var(--deep));box-shadow:0 1.2cqw 3cqw rgba(121,36,71,0.25),0 0 0 .6cqw rgba(121,36,71,.14);}
.orbit-arch img{width:100%;height:100%;object-fit:cover;filter:sepia(.15) saturate(.95);}
.orbit-name{font-family:var(--f-ar);font-weight:700;color:#ffffff;font-size:calc(2.3cqw*var(--ts));line-height:1.3;text-align:center;white-space:nowrap;}
.pol{position:absolute;left:calc(50% + var(--x)*1cqw);top:calc(50% + var(--y)*1cqw);translate:-50% -50%;width:16.5cqw;z-index:3;}
.pol-in{position:relative;rotate:var(--r);background:var(--paper);padding:.8cqw .8cqw 0;border-radius:.25cqw;box-shadow:0 1cqw 2.4cqw rgba(121,36,71,0.25);}
.pol-in::before{content:'';position:absolute;top:-.9cqw;left:50%;width:5cqw;height:1.6cqw;translate:-50% 0;rotate:-3deg;background:rgba(121,36,71,.55);}
.pol-ph{height:8.6cqw;overflow:hidden;background:linear-gradient(160deg,var(--deep),var(--deep));}
.pol-ph img{width:100%;height:100%;object-fit:cover;filter:sepia(.25) saturate(.95);}
.lz{opacity:0;transition:opacity .6s var(--ease);}
.lz.on{opacity:1;}
.pol-cap{display:flex;align-items:center;justify-content:center;min-height:5.2cqw;padding:.6cqw .3cqw .8cqw;font-family:var(--f-ar);font-weight:700;color:var(--deep);font-size:calc(1.7cqw*var(--ts));line-height:1.35;text-align:center;}

/* ===== SLIDE GRID ===== */
#gridLayer{position:absolute;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;background:rgba(254,246,213,.93);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s var(--ease),visibility .35s;}
#gridLayer.is-open{opacity:1;visibility:visible;pointer-events:auto;}
#gridPanel{width:92cqw;max-height:92%;overflow:auto;touch-action:pan-y;scrollbar-width:none;}
.g-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1cqw;font-family:var(--f-ui);font-weight:700;color:var(--gold-soft);font-size:clamp(1rem,1.9cqw,1.5rem);}
#gridClose{width:3.6cqw;height:3.6cqw;border-radius:50%;background:rgba(121,36,71,.14);display:flex;align-items:center;justify-content:center;}
#gridClose svg{width:44%;height:44%;}
#gridBody{display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw;}
.thumb{position:relative;aspect-ratio:16/9;border-radius:.8cqw;overflow:hidden;border:1px solid var(--line);background:linear-gradient(155deg,var(--deep),var(--ink) 60%,#F5D0BE 140%);text-align:right;transition:transform .25s var(--ease),border-color .25s;}
.thumb:hover,.thumb:focus-visible{transform:translateY(-.3cqw);border-color:var(--amber);outline:0;}
.th-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.85;}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(254,246,213,.93),rgba(254,246,213,.1) 70%);}
.th-n{position:absolute;top:.5cqw;right:.6cqw;z-index:2;font-family:var(--f-ui);font-weight:700;font-size:clamp(.7rem,1.1cqw,.9rem);color:var(--deep);background:var(--gold-soft);border-radius:999px;padding:.05cqw .6cqw;}
.th-t{position:absolute;bottom:.6cqw;right:.7cqw;left:.7cqw;z-index:2;font-family:var(--f-ar);font-weight:700;font-size:clamp(.75rem,1.35cqw,1.1rem);line-height:1.45;color:#ffffff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.thumb.is-cur{border-color:var(--amber);box-shadow:0 0 0 .25cqw var(--amber);}

/* ===== BOTTOM SHEET (definitions) ===== */
#modalLayer{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;background:rgba(254,246,213,0);visibility:hidden;pointer-events:none;transition:background .4s var(--ease),visibility .55s;}
#modalLayer.is-open{background:rgba(254,246,213,.5);visibility:visible;pointer-events:auto;}
#modalCard{position:relative;width:100%;min-height:34%;max-height:74%;overflow:hidden auto;touch-action:pan-y;scrollbar-width:none;display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);gap:3.4cqw;align-content:center;padding:3.4cqw 5cqw 3.6cqw;border-radius:2.2cqw 2.2cqw 0 0;background:linear-gradient(180deg,rgba(254,246,213,.95),rgba(254,246,213,.97));border-top:1px solid rgba(208,87,85,.55);box-shadow:0 -2cqw 6cqw rgba(121,36,71,0.23);transform:translateY(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);}
#modalLayer.is-open #modalCard{transform:none;}
#modalCard::before{content:'';position:absolute;top:1cqw;left:50%;width:6cqw;height:.45cqw;margin-left:-3cqw;border-radius:9px;background:rgba(121,36,71,.4);}
.sh-head{display:flex;flex-direction:column;align-items:flex-start;gap:1cqw;}
.m-type{font-family:var(--f-ui);font-weight:700;font-size:calc(clamp(.8rem,1.4cqw,1.15rem)*var(--ts));color:var(--deep);background:var(--gold-soft);padding:.25em 1em;border-radius:999px;}
#modalTitle{font-family:var(--f-ar);font-weight:700;line-height:1.4;color:#ffffff;font-size:calc(clamp(1.8rem,4.6cqw,3.8rem)*var(--ts));}
.sh-body{font-family:var(--f-ar);line-height:1.9;color:var(--paper);font-size:calc(clamp(1.2rem,2.5cqw,2rem)*var(--ts));padding-inline-start:3.4cqw;border-inline-start:1px solid var(--line);align-self:center;}
#modalClose{position:absolute;top:1.6cqw;left:2cqw;display:flex;align-items:center;gap:.6em;padding:.5cqw 1.4cqw;border-radius:999px;background:rgba(121,36,71,.16);color:var(--paper);font-family:var(--f-ui);font-weight:700;font-size:clamp(.8rem,1.4cqw,1.1rem);}
#modalClose:hover,#modalClose:focus-visible{background:rgba(121,36,71,.3);outline:0;}
#modalClose svg{width:1em;height:1em;}

#debugOverlay{position:absolute;top:1cqw;right:1cqw;z-index:80;background:rgba(0,0,0,.75);color:#FADE65;font-family:monospace;font-size:11px;line-height:1.5;padding:.6em .8em;border-radius:4px;white-space:pre;pointer-events:none;display:none;text-align:left;direction:ltr;}
#debugOverlay.is-on{display:block;}

/* ===== CINEMATIC TRANSITIONS (direction via --d / --w0) ===== */
.tr-zoom.is-active{animation:xZoomIn 1s var(--ease-cine) both;}
.tr-zoom.is-leaving{animation:xZoomOut .9s var(--ease-cine) both;}
@keyframes xZoomIn{from{opacity:0;transform:scale(1.12);}to{opacity:1;transform:none;}}
@keyframes xZoomOut{from{opacity:1;}to{opacity:0;transform:scale(.95);}}
.tr-mask.is-active{animation:xMaskIn .95s var(--ease-cine) both;}
.tr-mask.is-leaving{animation:xFadeOut .8s var(--ease) both;}
@keyframes xMaskIn{from{clip-path:inset(100% 0 0 0);transform:scale(1.04);}to{clip-path:inset(0);transform:none;}}
.tr-push.is-active{animation:xPushIn .9s var(--ease-cine) both;}
.tr-push.is-leaving{animation:xPushOut .9s var(--ease-cine) both;}
@keyframes xPushIn{from{opacity:0;transform:translate3d(calc(var(--d,1)*-7%),0,0);}to{opacity:1;transform:none;}}
@keyframes xPushOut{from{opacity:1;}to{opacity:0;transform:translate3d(calc(var(--d,1)*7%),0,0);}}
.tr-depth.is-active{animation:xDepthIn 1s var(--ease-cine) both;}
.tr-depth.is-leaving{animation:xDepthOut .8s var(--ease-cine) both;}
@keyframes xDepthIn{from{opacity:0;transform:scale(.94) translateY(2cqw);}to{opacity:1;transform:none;}}
@keyframes xDepthOut{from{opacity:1;}to{opacity:0;transform:scale(1.06);}}
.tr-wipe.is-active{animation:xWipeIn .9s var(--ease-cine) both;}
.tr-wipe.is-leaving{animation:xFadeOut .9s var(--ease) both;}
@keyframes xWipeIn{from{clip-path:var(--w0,inset(0 100% 0 0));}to{clip-path:inset(0);}}
.tr-curtain.is-active{animation:xCurtainIn 1s var(--ease-cine) both;}
.tr-curtain.is-leaving{animation:xFadeOut .8s var(--ease) both;}
@keyframes xCurtainIn{from{clip-path:inset(0 50% 0 50%);}to{clip-path:inset(0);}}
.tr-dissolve.is-active{animation:xDissolveIn .9s var(--ease) both;}
.tr-dissolve.is-leaving{animation:xFadeOut .9s var(--ease) both;}
@keyframes xDissolveIn{from{opacity:0;transform:scale(1.03);}to{opacity:1;transform:none;}}
@keyframes xFadeOut{from{opacity:1;}to{opacity:0;}}

@media (pointer:coarse){
  .is-active .slide-bg.drift .bg-motion,.is-leaving .slide-bg.drift .bg-motion{animation-duration:40s;}
}
@media (prefers-reduced-motion:reduce){
  .bg-motion{animation:none!important;}
  .reveal{animation:none!important;opacity:1!important;transform:none!important;}
  [class*="tr-"].is-active,[class*="tr-"].is-leaving{animation-duration:.25s!important;}
  .is-active .slide-body,.is-active .speech-frame,.st-in>*{animation:none!important;opacity:1!important;}
  .chev{animation:none;}
}
@media (max-width:640px){
  .cards-2{grid-template-columns:1fr;}
  .vocab-grid{grid-template-columns:repeat(2,1fr);}
  #gridBody{grid-template-columns:repeat(3,1fr);}
}

/* ===== PERFORMANCE LAYER (adaptive: html.lite / html.lite2 are set by JS) ===== */
html:not(.lite) .slide-body,html:not(.lite) .speech-frame{-webkit-backdrop-filter:blur(8px) saturate(1.1);backdrop-filter:blur(8px) saturate(1.1);}
@media (pointer:coarse){html:not(.lite) .slide-body,html:not(.lite) .speech-frame{-webkit-backdrop-filter:blur(6px) saturate(1.1);backdrop-filter:blur(6px) saturate(1.1);}}
/* lite: no backdrop blur (bg is already blurred) — compensate with a faint tint, lighter shadows */
html.lite .slide-body,html.lite .speech-frame{background-color:rgba(254,246,213,.2);}
html.lite .slide-body{box-shadow:0 1.2cqw 3cqw rgba(121,36,71,0.20),inset 0 1px 0 rgba(121,36,71,.16);}
html.lite .speech-frame{box-shadow:0 1.2cqw 3cqw rgba(121,36,71,0.20),inset 0 1px 0 rgba(121,36,71,.16),inset -.5cqw 0 0 rgba(121,36,71,0.25);}
/* lite: clip-path transitions repaint every frame -> same feel with compositor-only transforms */
@keyframes xRiseIn{from{opacity:0;transform:translate3d(0,4%,0);}to{opacity:1;transform:none;}}
html.lite .tr-mask.is-active:not(.is-leaving){animation:xRiseIn .8s var(--ease-cine) both;}
html.lite .tr-wipe.is-active:not(.is-leaving){animation:xPushIn .8s var(--ease-cine) both;}
html.lite .tr-curtain.is-active:not(.is-leaving){animation:xDissolveIn .8s var(--ease) both;}
/* lite2 (weak devices): static background, no continuous motion */
html.lite2 .bg-motion{animation:none!important;}
/* pause continuous animation when nobody can see it */
body.ov .bg-motion,body.ov .chev,html.is-paused .bg-motion,html.is-paused .chev{animation-play-state:paused!important;}

/* ===== SCENES — visual pengganti foto latar (SVG/CSS ringan, hanya transform/opacity) ===== */
.slide-scene .t-xl{font-size:calc(clamp(1.7rem,4.2cqw,3.5rem)*var(--ts));}
.slide-scene .t-md{font-size:calc(clamp(1rem,2cqw,1.6rem)*var(--ts));}
.slide-scene .t-sm{font-size:calc(clamp(.9rem,1.7cqw,1.4rem)*var(--ts));}
.slide-scene p{line-height:1.75;}
.slide-scene .slide-body{padding:2.2cqw 2.8cqw 2.4cqw!important;}
.slide[data-id=profile2] .t-xl{font-size:calc(clamp(1.6rem,3.8cqw,3.2rem)*var(--ts));}
.slide[data-id=profile2] .t-md{font-size:calc(clamp(.95rem,1.8cqw,1.45rem)*var(--ts));}
.slide[data-id=profile2] .t-sm{font-size:calc(clamp(.85rem,1.55cqw,1.25rem)*var(--ts));}
.slide[data-id=profile2]{padding-top:4.6cqw;padding-bottom:5.8cqw;}
.slide[data-id=profile2] .slide-body{height:100%;}
.slide-bg.scene{background:#792447;}
.slide-bg.scene::after{opacity:.03;}
.sc-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.slide-bg.scene .fallback{display:none;}

/* 2 — peta pulau */
.sc-isl,.sc-city,.sc-compass{transform-box:fill-box;transform-origin:center;}
.is-active .sc-isl{animation:scIsl .9s var(--ease-soft) calc(.25s + var(--i)*.1s) both;}
.is-active .sc-city{animation:scFade .7s var(--ease) calc(.9s + var(--i)*.12s) both;}
.is-active .sc-compass{animation:scFade 1s var(--ease) .5s both;}
@keyframes scIsl{from{opacity:0;transform:scale(.72);}}
@keyframes scFade{from{opacity:0;}}
.sc-rip{transform-box:fill-box;transform-origin:center;}
.is-active .sc-rip{animation:scRip 3.8s ease-in-out infinite alternate;}
@keyframes scRip{from{opacity:.25;transform:scale(.985);}to{opacity:1;transform:scale(1.02);}}
.sc-route{stroke-dashoffset:0;}
.is-active .sc-route{animation:scDash 2.4s linear infinite;}
@keyframes scDash{to{stroke-dashoffset:-48;}}
.sc-ping{transform-box:fill-box;transform-origin:center;}
.is-active .sc-ping{animation:scPing 2.4s ease-out infinite;}
@keyframes scPing{from{opacity:.9;transform:scale(1);}to{opacity:0;transform:scale(3.2);}}

/* 3 — pintu terbuka */
.dr-wrap{position:absolute;left:67cqw;top:7.5cqw;width:24cqw;height:40cqw;}
.dr-glow{position:absolute;left:50%;top:56%;width:78cqw;height:78cqw;translate:-50% -50%;background:radial-gradient(circle,rgba(250,222,101,.55),rgba(208,87,85,.2) 36%,transparent 64%);}
.dr-rays{position:absolute;left:50%;top:60%;width:92cqw;height:92cqw;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(250,222,101,.2) 0 4deg,transparent 4deg 15deg);-webkit-mask-image:radial-gradient(circle,var(--deep) 6%,transparent 62%);mask-image:radial-gradient(circle,var(--deep) 6%,transparent 62%);}
.dr-frame{position:absolute;inset:-1.2cqw -1.2cqw 0;border-radius:13.2cqw 13.2cqw 0 0;border:.5cqw solid #E9A79B;border-bottom:0;background:linear-gradient(180deg,#A8406A,#792447);box-shadow:0 0 0 .9cqw rgba(208,87,85,.22),0 2cqw 5cqw rgba(121,36,71,0.27);}
.doorway{position:absolute;inset:0;border-radius:12cqw 12cqw 0 0;overflow:hidden;perspective:62cqw;background:#FDF1C0;}
.dr-light{position:absolute;inset:0;background:radial-gradient(ellipse 85% 92% at 50% 78%,#FFFBE8 0%,#FCE9A0 26%,#EBA07E 62%,#9C3A52 100%);}
.dr-sil{position:absolute;left:0;bottom:0;width:100%;height:46%;}
.dr-leaf{position:absolute;top:0;bottom:0;width:50.5%;backface-visibility:hidden;border:.3cqw solid #E7A59C;
  background:radial-gradient(circle at 50% 50%,#FBE59A 0 .34cqw,transparent .4cqw) 0 0/6cqw 6cqw,
  repeating-linear-gradient(90deg,rgba(121,36,71,.1) 0 .14cqw,transparent .14cqw 2.9cqw),
  linear-gradient(180deg,#9A3A5E,#8A2C51 60%,#792447);}
.dr-leaf::after{content:'';position:absolute;top:52%;width:1.7cqw;height:1.7cqw;border:.28cqw solid #FBE59A;border-radius:50%;}
.dr-leaf.l{left:0;transform-origin:0 50%;transform:rotateY(76deg);}
.dr-leaf.l::after{right:1.4cqw;}
.dr-leaf.r{right:0;transform-origin:100% 50%;transform:rotateY(-76deg);}
.dr-leaf.r::after{left:1.4cqw;}
.dr-floor{position:absolute;left:-14%;right:-14%;top:100%;height:9.5cqw;clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(250,222,101,.7),rgba(250,222,101,0));}
.dr-mote{position:absolute;left:var(--mx);bottom:6%;width:.55cqw;height:.55cqw;border-radius:50%;background:#ffffff;opacity:0;}
.is-active .dr-leaf.l{animation:drL 2s var(--ease-cine) .6s both;}
.is-active .dr-leaf.r{animation:drR 2s var(--ease-cine) .6s both;}
@keyframes drL{from{transform:rotateY(0deg);}}
@keyframes drR{from{transform:rotateY(0deg);}}
.is-active .dr-light{animation:drLight 2s ease .6s both;}
@keyframes drLight{from{opacity:.05;}}
.is-active .dr-glow,.is-active .dr-rays,.is-active .dr-floor{animation:drLight 2.2s ease .7s both;}
.is-active .dr-mote{animation:drMote var(--md) linear var(--mdl) infinite;}
@keyframes drMote{0%{opacity:0;transform:translate3d(0,0,0);}20%{opacity:.9;}100%{opacity:0;transform:translate3d(var(--dx),-17cqw,0);}}

/* 4 — kecil vs besar */
.vs-row,.vs-lab,.vs-small,.vs-flag{transform-box:fill-box;}
.is-active .vs-row{animation:vsRow .9s var(--ease-soft) calc(.25s + var(--i)*.09s) both;}
@keyframes vsRow{from{opacity:0;transform:translate3d(-60px,0,0);}}
.is-active .vs-small{animation:vsUp 1s var(--ease-soft) 1s both;}
@keyframes vsUp{from{opacity:0;transform:translate3d(0,40px,0);}}
.is-active .vs-lab{animation:scFade .8s var(--ease) calc(1.2s + var(--i)*.35s) both;}
.vs-flag{transform-origin:0 50%;}
.is-active .vs-flag{animation:vsFlag 1.6s ease-in-out infinite alternate;}
@keyframes vsFlag{from{transform:skewY(-3deg) scaleX(.94);}to{transform:skewY(3deg) scaleX(1);}}

/* 5 — kemenangan */
.bt-sun,.bt-flag,.bt-flagwrap,.bt-wreath{transform-box:fill-box;}
.is-active .bt-sun{animation:btSun 1.8s var(--ease-soft) .25s both;}
@keyframes btSun{from{opacity:.15;transform:translate3d(0,150px,0);}}
.is-active .bt-flagwrap{animation:btFlag 1.3s var(--ease-soft) 1s both;}
@keyframes btFlag{from{opacity:0;transform:translate3d(0,110px,0);}}
.is-active .bt-wreath{animation:btWreath 1.2s var(--ease-soft) .7s both;transform-origin:center;}
@keyframes btWreath{from{opacity:0;transform:scale(.9);}}
.bt-flag{transform-origin:0 50%;}
.is-active .bt-flag{animation:vsFlag 1.4s ease-in-out 2.2s infinite alternate;}
.bt-spark{opacity:0;}
.is-active .bt-spark{animation:btSpark var(--sd) linear var(--sdl) infinite;}
@keyframes btSpark{0%{opacity:0;translate:0 0;}20%{opacity:.95;}100%{opacity:0;translate:0 -150px;}}

/* 6 — polaroid */
.pl-table{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(121,36,71,.06) 0 .18cqw,transparent .18cqw 9cqw),radial-gradient(90% 90% at 25% 50%,#FCE9A0,#FADE65 70%,#F5D0BE);}
.pl-thread{position:absolute;inset:0;width:100%;height:100%;}
.pol2{position:absolute;left:calc(var(--x)*1cqw);top:calc(var(--y)*1cqw);translate:-50% -50%;rotate:var(--r);width:17cqw;background:var(--paper);padding:.8cqw .8cqw 0;border-radius:.25cqw;box-shadow:0 1cqw 2.4cqw rgba(121,36,71,0.27);}
.pol2::before{content:'';position:absolute;top:-.9cqw;left:50%;width:5cqw;height:1.6cqw;translate:-50% 0;rotate:-3deg;background:rgba(250,222,101,.6);}
.pol2 .ph{height:11.4cqw;overflow:hidden;background:#F5D0BE;}
.pol2 .ph svg{width:100%;height:100%;display:block;}
.pol2 .cap{display:flex;align-items:center;justify-content:center;min-height:5.4cqw;padding:.5cqw .3cqw .8cqw;font-family:var(--f-ar);font-weight:700;color:#5A1A35;font-size:2.1cqw;line-height:1.3;text-align:center;}
.is-active .pol2{animation:polIn .9s var(--ease-soft) calc(.3s + var(--i)*.2s) both;}
@keyframes polIn{from{opacity:0;scale:1.18;rotate:calc(var(--r) + 14deg);translate:-50% calc(-50% - 7cqw);}}

@media (prefers-reduced-motion:reduce){
  .slide-bg.scene *{animation:none!important;}
}
html.lite2 .sc-rip,html.lite2 .sc-ping,html.lite2 .sc-route,html.lite2 .dr-mote,html.lite2 .bt-spark,html.lite2 .vs-flag,html.lite2 .bt-flag{animation:none!important;}
html.lite2 .dr-mote{display:none;}
body.ov .slide-bg.scene *,html.is-paused .slide-bg.scene *{animation-play-state:paused!important;}

/* =====================================================================
   6-SLIDE VERSION — styles for the new slides (reuse of old animation system)
   ===================================================================== */
.slide{padding-top:5.2cqw;padding-bottom:6.4cqw;}

/* --- slide 1: outline of "قائل النص" --- */
.slide-outline .slide-body{padding:2cqw 2.6cqw 2.1cqw!important;gap:.5cqw;}
.ol-head{display:flex;align-items:center;gap:1.5cqw;}
.ol-arch{width:6.2cqw;height:8.2cqw;flex:none;border-radius:999px 999px .8cqw .8cqw;overflow:hidden;border:.2cqw solid var(--gold-soft);background:linear-gradient(160deg,var(--deep),var(--deep));box-shadow:0 .8cqw 2cqw rgba(121,36,71,0.25),0 0 0 .45cqw rgba(121,36,71,.14);}
.ol-arch img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:sepia(.15) saturate(.95);}
.ol-ttl{display:flex;flex-direction:column;gap:.1cqw;}
.ol-ttl h2{font-size:calc(clamp(1.4rem,3.2cqw,2.7rem)*var(--ts));line-height:1.3;}
.ol-ttl h2::after{display:none;}
.ol-yrs{white-space:nowrap;font-family:var(--f-ui);font-weight:500;color:var(--gold-soft);font-size:calc(clamp(.8rem,1.35cqw,1.1rem)*var(--ts));letter-spacing:.04em;}
.ol-list{display:flex;flex-direction:column;gap:.55cqw;margin-top:.3cqw;}
.ol-row{display:grid;grid-template-columns:2.4cqw 1fr;gap:1cqw;align-items:start;padding:.55cqw 1cqw;border-radius:.8cqw;background:rgba(121,36,71,.07);border:1px solid var(--line);}
.ol-n{width:2.1cqw;height:2.1cqw;margin-top:.5cqw;display:flex;align-items:center;justify-content:center;background:var(--amber);transform:rotate(45deg);border-radius:.25cqw;}
.ol-n i{transform:rotate(-45deg);font-style:normal;font-family:var(--f-ui);font-weight:700;color:var(--deep);font-size:calc(1.15cqw*var(--ts));line-height:1;}
.slide .ol-row p{font-size:calc(clamp(.88rem,1.5cqw,1.3rem)*var(--ts));line-height:1.7;color:var(--paper);}
.ol-row b{color:var(--gold-soft);font-weight:700;}

/* --- slides 2-3: the speech text --- */
.nass{display:flex;flex-direction:column;gap:.9cqw;}
.nass-hero{font-family:var(--f-ar);font-weight:700;color:#ffffff;line-height:1.5;font-size:calc(clamp(1.7rem,3.5cqw,3rem)*var(--ts));}
.nass-p{font-family:var(--f-ar);line-height:1.85;color:var(--paper);font-size:calc(clamp(1.1rem,2cqw,1.7rem)*var(--ts));}
.nass-block{display:grid;grid-template-columns:5.4cqw 1fr;gap:2cqw;align-items:center;padding:1.7cqw 2cqw;margin-top:.8cqw;border-radius:1.2cqw;background:rgba(121,36,71,.07);border:1px solid var(--line);}
.nass-badge{width:5cqw;height:5cqw;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-soft),var(--amber));transform:rotate(45deg);border-radius:.6cqw;box-shadow:0 0 2.4cqw rgba(121,36,71,0.20);}
.nass-badge i{transform:rotate(-45deg);font-style:normal;font-family:var(--f-ar);font-weight:700;color:var(--deep);font-size:calc(2.9cqw*var(--ts));line-height:1;}
.nass-bt{font-family:var(--f-ar);line-height:1.95;color:var(--paper);font-size:calc(clamp(1.3rem,2.6cqw,2.2rem)*var(--ts));}

/* --- slides 4-5: خصائص النص --- */
.kh{justify-content:center!important;gap:1cqw!important;}
.kh-top{display:flex;align-items:center;gap:1.6cqw;}
.kh-top h2{font-size:calc(clamp(1.5rem,3.3cqw,2.8rem)*var(--ts));}
.kh-top h2::after{display:none;}
.kh-range{font-family:var(--f-ui);font-weight:700;color:var(--deep);background:var(--gold-soft);padding:.25cqw 1.4cqw;border-radius:999px;font-size:calc(clamp(.9rem,1.6cqw,1.3rem)*var(--ts));}
.kh-h{font-family:var(--f-ar);font-weight:700;color:#ffffff;display:flex;align-items:center;gap:1cqw;font-size:calc(clamp(1.15rem,2.2cqw,1.8rem)*var(--ts));}
.kh-no{display:inline-flex;align-items:center;justify-content:center;min-width:2.4cqw;height:2.4cqw;font-family:var(--f-ui);font-weight:700;color:var(--deep);background:var(--amber);border-radius:50%;font-size:calc(1.4cqw*var(--ts));}
.kh-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9cqw;}
.kh-item{display:grid;grid-template-columns:2.6cqw 1fr;gap:1.1cqw;align-items:start;padding:1cqw 1.3cqw;border-radius:1cqw;background:rgba(121,36,71,.07);border:1px solid var(--line);}
.kh-l{width:2.2cqw;height:2.2cqw;margin-top:.45cqw;display:flex;align-items:center;justify-content:center;background:var(--amber);transform:rotate(45deg);border-radius:.25cqw;}
.kh-l i{transform:rotate(-45deg);font-style:normal;font-family:var(--f-ar);font-weight:700;color:var(--deep);font-size:calc(1.35cqw*var(--ts));line-height:1;}
.slide .kh-item p{font-size:calc(clamp(.95rem,1.68cqw,1.45rem)*var(--ts));line-height:1.75;color:var(--paper);}
.kh-two{border-color:rgba(121,36,71,.6);background:rgba(208,87,85,.14);}
.kh-two .kh-l{background:var(--gold-soft);}
.kh-cols{display:grid;grid-template-columns:.82fr 1.18fr;gap:1.4cqw;align-items:stretch;}
.kh-big{position:relative;display:flex;flex-direction:column;gap:.8cqw;padding:1.6cqw 1.8cqw 1.8cqw;border-radius:1.2cqw;background:rgba(121,36,71,.07);border:1px solid var(--line);}
.kh-bn{width:4.2cqw;height:4.2cqw;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-weight:700;color:var(--deep);font-size:calc(2.2cqw*var(--ts));background:linear-gradient(135deg,var(--gold-soft),var(--amber));border-radius:50%;box-shadow:0 0 2cqw rgba(121,36,71,0.18);}
.slide .kh-big p{font-size:calc(clamp(1.05rem,1.95cqw,1.65rem)*var(--ts));line-height:1.9;color:var(--paper);}

/* --- slide 6: thanks (door of knowledge + six stars + rising sparks) --- */
.slide-thanks .slide-body{padding:2.4cqw 3cqw 2.5cqw!important;}
.thx-h{font-size:calc(clamp(1.8rem,3.9cqw,3.3rem)*var(--ts));}
.slide .thx-1{font-size:calc(clamp(1.1rem,2cqw,1.7rem)*var(--ts));line-height:1.85;}
.slide .thx-2{font-size:calc(clamp(1rem,1.75cqw,1.5rem)*var(--ts));line-height:1.85;}
.slide .thx-sign{font-size:calc(clamp(1rem,1.75cqw,1.5rem)*var(--ts));color:var(--gold-soft)!important;margin-top:.3cqw;}
.six-row{display:flex;gap:1.3cqw;align-items:center;margin:.5cqw 0 .1cqw .2cqw;}
.six-star{display:block;width:1.35cqw;height:1.35cqw;background:linear-gradient(135deg,var(--gold-soft),var(--amber));transform:rotate(45deg);opacity:0;box-shadow:0 0 1cqw rgba(121,36,71,0.23);}
.is-active .six-star{animation:sixIn .8s var(--ease-soft) calc(2.1s + var(--i)*.28s) both,sixTw 2.4s ease-in-out calc(4.2s + var(--i)*.33s) infinite alternate;}
@keyframes sixIn{from{opacity:0;transform:rotate(45deg) scale(.15);}to{opacity:1;transform:rotate(45deg) scale(1);}}
@keyframes sixTw{from{box-shadow:0 0 .5cqw rgba(121,36,71,0.16);}to{box-shadow:0 0 1.9cqw var(--gold-soft);}}
.thx-spark{position:absolute;left:var(--sx);bottom:var(--sb);width:.5cqw;height:.5cqw;border-radius:50%;background:#ffffff;box-shadow:0 0 .8cqw #ffffff;opacity:0;pointer-events:none;}
.is-active .thx-spark{animation:thxSpark var(--sd) linear var(--sdl) infinite;}
@keyframes thxSpark{0%{opacity:0;translate:0 0;}20%{opacity:.95;}100%{opacity:0;translate:0 -19cqw;}}
html.lite2 .thx-spark{display:none;}
html.lite2 .six-star{animation:none!important;opacity:1;}
body.ov .thx-spark,html.is-paused .thx-spark{animation-play-state:paused!important;}
@media (prefers-reduced-motion:reduce){.six-star{animation:none!important;opacity:1;}.thx-spark{display:none;}}


/* =====================================================================
   SKIN: Butter Yellow #FADE65 + Wine Red #792447 + Dusty Coral #D05755
   Hanya warna, font, dan bentuk. Keyframes, transisi, dan JS tidak diubah.
   Krem butter #FEF6D5 · butter #FADE65 / #FCE9A0 · wine #792447 · coral #D05755 (teks kecil pakai coral lebih tua #B04646 agar terbaca)
   ===================================================================== */
:root{
  --cream:#FEF6D5;--cream-2:#FCEFB8;
  --rose-100:#FCE9A0;--rose-200:#FADE65;--rose-400:#D05755;
  --sage-100:#F5D0BE;--sage-200:#E7A59C;--sage-400:#D05755;--sage-700:#B04646;
  --head:#792447;--deep:#792447;
  --ink:#FEF6D5;--paper:#4E1530;--paper-dim:#8A3E5B;--sand:#9A4A65;
  --clay:#D05755;--amber:#E7A59C;--gold:#FCE9A0;--gold-soft:#FADE65;
  --line:rgba(208,87,85,.4);
  --f-ar:'Amiri','Tajawal','IBM Plex Sans Arabic','Noto Naskh Arabic',serif;
}
html,body,#stageWrap{background:#F3D36B;}
#canvas{background:var(--cream);box-shadow:0 20px 60px rgba(121,36,71,.22);}
.slide-bg,.slide-bg.scene{background:var(--cream);}
.slide-bg .fallback{background:linear-gradient(160deg,#FCE9A0,#FEF6D5 58%,#F5D0BE);}
.slide-bg img{filter:blur(var(--bb,5px)) saturate(.7) sepia(.32);}

/* tipografi: serif Arab klasik untuk kesan vintage */
.slide h1,.slide h2,#startScreen h1{font-weight:700;color:var(--head);text-shadow:none;}
.slide p,.speech-text,.nass-p,.nass-bt,.sh-body{color:var(--paper);}
.slide-body h2::after,.slide-body h1::after,.st-frame{display:none;}
.slide-cover .sub,#startScreen .sub,.slide .lede{color:var(--paper);}
.slide-cover .yr,.ol-yrs{color:var(--sage-700);}

/* label & penanda */
.kicker,.speech-label,.slide-cover .eyebrow,#startScreen .eyebrow,.st-route,.g-head,
.card .num,.rhet-card .hint-open,.ol-row b,.slide .thx-sign,.rt-node.is-cur{color:var(--sage-700)!important;}
.kicker::before,.speech-label::before,#startScreen .eyebrow::before,#startScreen .eyebrow::after{background:var(--rose-400);border-radius:50%;}
.chain i,.st-route i{color:var(--rose-400);}
.ol-n,.kh-l,.nass-badge,.six-star,.rt-mark,.kh-no{border-radius:50%;}
.ol-n i,.kh-l i,.kh-no,.nass-badge i,.kh-bn{color:var(--deep);}
.rt-mark{background:var(--rose-400);box-shadow:0 0 0 .3cqw rgba(208,87,85,.3);}

/* kartu utama: krem hangat + bingkai tipis ganda ala kartu pos lama */
.slide-body,.speech-frame{
  background:linear-gradient(155deg,rgba(254,246,213,.9),rgba(252,239,184,.93) 62%,rgba(247,215,190,.9));
  border:1px solid rgba(208,87,85,.55);border-radius:1.1cqw;
  box-shadow:0 1.6cqw 4.4cqw rgba(121,36,71,.18),inset 0 0 0 .4cqw rgba(254,246,213,.95),inset 0 0 0 .46cqw rgba(231,165,156,.95);
}
.slide-cover .slide-body{background:linear-gradient(0deg,rgba(254,246,213,.94),rgba(252,236,175,.84));}
.speech-frame{background:linear-gradient(155deg,rgba(254,246,213,.93),rgba(252,238,180,.95) 62%,rgba(247,215,190,.92));
  box-shadow:0 1.6cqw 4.4cqw rgba(121,36,71,.18),inset 0 0 0 .4cqw rgba(254,246,213,.95),inset 0 0 0 .46cqw rgba(231,165,156,.95),inset -.6cqw 0 0 rgba(250,222,101,.9);}
html.lite .slide-body,html.lite .speech-frame{background-color:rgba(254,246,213,.6);}

/* kartu dalam: pink pastel lembut, tanpa garis keras */
.card,.ol-row,.kh-item,.kh-big,.nass-block,.vocab-pill,.chain span{background:rgba(252,233,160,.5);border:1px solid rgba(250,222,101,.7);}
.card h3,.rhet-card .q,.kh-h,.vocab-pill,.speech-hero,.nass-hero,.orbit-name,#modalTitle,.th-t{color:var(--head);}
.slide .card p,.slide .ol-row p,.slide .kh-item p,.slide .kh-big p,.chain span{color:var(--paper);}
.kh-item:nth-child(even),.ol-row:nth-child(even){background:rgba(245,208,190,.65);border-color:rgba(224,140,130,.8);}
.kh-item.kh-two{background:rgba(231,165,156,.6);border:1px solid #D05755;}
.rhet-card:hover,.vocab-pill:hover,.vocab-pill:focus-visible{background:rgba(250,222,101,.65);border-color:var(--rose-400);}
.speech-note{color:var(--sand);}
.term{color:var(--head);background:linear-gradient(rgba(208,87,85,.55),rgba(208,87,85,.55)) 0 100%/100% .12em no-repeat;}
.term:hover,.term:focus-visible{color:var(--deep);background-size:100% 100%;}

/* chip & tombol */
.tag-word,.kh-range,.m-type,.th-n{background:var(--rose-200);color:var(--deep);}
.vocab-tab{background:rgba(245,208,190,.8);border:1px solid #E7A59C;color:var(--sage-700);}
.vocab-tab:not(.is-on):hover{background:#F2BFA9;}
.vocab-tab.is-on{background:var(--rose-200);border-color:var(--rose-200);color:var(--deep);}
#startBtn{background:linear-gradient(135deg,#FCE9A0,#FADE65 75%);color:var(--deep);border:1px solid rgba(208,87,85,.7);box-shadow:0 .5cqw 2cqw rgba(208,87,85,.35);}
#startBtn:hover,#startBtn:focus-visible{transform:translateY(-3px);box-shadow:0 .7cqw 2.6cqw rgba(208,87,85,.5);}

/* layar mulai */
#startScreen{background:var(--cream);}
#startBg .overlay{background:radial-gradient(90% 60% at 50% 100%,rgba(250,222,101,.55),transparent 65%),radial-gradient(ellipse at center,rgba(254,246,213,.45) 20%,rgba(254,246,213,.85)),linear-gradient(180deg,rgba(254,246,213,.7),rgba(252,236,175,.7));}
#startScreen::before,#startScreen::after{background:#FADE65;}
#startScreen h1{color:var(--head);}

/* progres, rute, kontrol */
#pbar{background:rgba(208,87,85,.2);}
#pbar i,.rt-fill{background:linear-gradient(270deg,#D05755,#792447);}
.rt-track{background:rgba(208,87,85,.35);}
.rt-node{color:rgba(176,70,70,.7);}
.rt-node i{background:var(--cream);border-color:#D05755;}
.rt-node.is-on{color:var(--paper);}
.rt-node.is-on i{background:var(--rose-400);border-color:var(--rose-400);}
#controls{background:rgba(254,246,213,.94);border:1px solid rgba(208,87,85,.5);box-shadow:0 .5cqw 2cqw rgba(121,36,71,.2);}
.ctl-btn{color:var(--sage-700);}
.ctl-btn:hover,.ctl-btn:focus-visible{background:rgba(231,165,156,.6);color:var(--deep);}
#btnNext{background:var(--rose-200);color:var(--deep);}
#btnNext:hover,#btnNext:focus-visible{background:var(--rose-400);color:#fff;transform:scale(1.07);}
#btnMusic:not(.is-off){color:var(--rose-400);}
.ctl-btn.is-off{color:#C9A3A8;}
#slideCounter{color:var(--paper-dim);}
#pmini{background:rgba(254,246,213,.9);color:var(--paper-dim);border:1px solid var(--line);}
#termHint{background:rgba(254,246,213,.95);color:var(--paper);border:1px solid var(--line);}
.start-hint{color:var(--paper-dim);}

/* panel slide & bottom sheet */
#gridLayer{background:rgba(254,246,213,.96);}
#gridClose,#modalClose{background:rgba(231,165,156,.6);color:var(--sage-700);}
#modalClose:hover,#modalClose:focus-visible{background:rgba(231,165,156,.95);}
.thumb{background:linear-gradient(155deg,#FCE9A0,#FEF6D5 60%,#F5D0BE);border-color:rgba(208,87,85,.35);}
.thumb::after{background:linear-gradient(0deg,rgba(254,246,213,.95),rgba(254,246,213,.05) 70%);}
.thumb.is-cur{border-color:var(--rose-400);box-shadow:0 0 0 .25cqw var(--rose-400);}
#modalLayer.is-open{background:rgba(121,36,71,.28);}
#modalCard{background:linear-gradient(180deg,#FEF6D5,#FCEFB8);border-top:1px solid #E7A59C;box-shadow:0 -1cqw 4cqw rgba(121,36,71,.2);}
#modalCard::before{background:#E7A59C;}

/* foto & polaroid */
.ol-arch,.orbit-arch{border-radius:.6cqw;background:var(--sage-100);border-color:#E7A59C;}
.ol-arch img,.orbit-arch img,.pol-ph img{filter:sepia(.25) saturate(.8);}
.pol-ph,.pol2 .ph{background:var(--sage-100);}
.pol-in,.pol2{background:#FFFCEE;}
.pol-cap,.pol2 .cap{color:#5A1A35;}
.slide-orbit .slide-body::before{border-color:rgba(208,87,85,.55);}

/* kilau & bintang */
.thx-spark{background:#E0786B;box-shadow:0 0 .8cqw #E0786B;}
.six-star{background:#E0786B;box-shadow:0 0 1cqw rgba(208,87,85,.4);}
@keyframes sixTw{from{box-shadow:0 0 .5cqw rgba(208,87,85,.3);}to{box-shadow:0 0 1.6cqw #D05755;}}
.nass-badge,.kh-bn{background:#FADE65;box-shadow:0 0 1.6cqw rgba(208,87,85,.3);}



/* ===== SENTUHAN PALET: wine + butter seperti referensi ===== */
#startBtn{background:#792447;color:#FADE65;border:1px solid #792447;box-shadow:0 .5cqw 2cqw rgba(121,36,71,.35);}
#startBtn:hover,#startBtn:focus-visible{background:#D05755;color:#FADE65;border-color:#D05755;box-shadow:0 .7cqw 2.6cqw rgba(208,87,85,.5);}
#btnNext{background:#792447;color:#FADE65;}
#btnNext:hover,#btnNext:focus-visible{background:#D05755;color:#FADE65;}


/* ===== OPENING POSTER (native SVG + CSS, bukan gambar) ===== */
#startScreen{background:#5B1731;}
#startScreen::before,#startScreen::after,#startScreen .st-frame{display:none!important;}
#startBg,#stRoute{display:none;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
#startScreen .poster{position:absolute;inset:0;z-index:3;}
#startScreen .pt-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#startScreen .pt-ar{font-family:'Baloo Bhaijaan 2','Lalezar','Tajawal','Cairo',sans-serif;font-weight:800;}
#startScreen .pt-lat{direction:ltr;unicode-bidi:isolate;font-family:'Baloo Bhaijaan 2','Poppins','Tajawal',system-ui,sans-serif;font-weight:800;}
#startScreen .pt-drift{animation:ptDrift 16s ease-in-out infinite alternate;}
#startScreen .pt-title{transform-box:fill-box;transform-origin:center;animation:ptPop 1s cubic-bezier(.34,1.56,.64,1) .15s both;}
#startScreen .pt-pill{transform-box:fill-box;transform-origin:center;animation:ptRise .8s cubic-bezier(.22,.9,.3,1) both;}
#startScreen .pt-sp{transform-box:fill-box;transform-origin:center;animation:ptSpark 1.9s ease-in-out 1.1s infinite;}
#startBtn{position:absolute;left:0;right:0;bottom:4.2cqw;margin:0 auto;width:max-content;font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;font-weight:800;font-size:clamp(1rem,2cqw,1.6rem);letter-spacing:.01em;color:#6B1533;background:#FFF1D6;border:.3cqw solid #F8D95C;padding:.35em 1.7em .45em;border-radius:999px;display:inline-flex;align-items:center;gap:.7em;box-shadow:0 .45cqw 0 #3A0A1D,0 1cqw 2.6cqw rgba(30,5,15,.45);opacity:0;animation:ptRise .8s cubic-bezier(.22,.9,.3,1) 1.2s both;transition:transform .2s var(--ease),box-shadow .2s,background .2s;}
#startBtn:hover,#startBtn:focus-visible{background:#F8D95C;color:#6B1533;border-color:#FFF1D6;transform:translateY(-.25cqw);box-shadow:0 .7cqw 0 #3A0A1D,0 1.4cqw 3cqw rgba(30,5,15,.5);outline:0;}
#startBtn:active{transform:translateY(.2cqw);box-shadow:0 .2cqw 0 #3A0A1D;}
#startBtn svg{width:1.15em;height:1.15em;}
@keyframes ptPop{0%{opacity:0;transform:scale(.55) rotate(-4deg);}100%{opacity:1;transform:none;}}
@keyframes ptRise{0%{opacity:0;transform:translateY(26px);}100%{opacity:1;transform:none;}}
@keyframes ptSpark{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
@keyframes ptDrift{from{transform:translate(0,0);}to{transform:translate(-14px,10px);}}
@media (prefers-reduced-motion:reduce){#startScreen .pt-drift,#startScreen .pt-sp{animation:none;}}

/* ===== POSISI KONTROL & DEFINISI =====
   Bar kontrol (mundur/lanjut) menempel di dasar layar (bukan dasar kanvas 16:9),
   kolom definisi duduk tepat di atasnya. */
#stageWrap{container-type:inline-size;}
#controls{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));z-index:75;}
body.ov #controls.is-dim{opacity:1;pointer-events:auto;transform:translate(-50%,0);}
#modalLayer{box-sizing:border-box;padding-bottom:5.4cqw;}
#modalCard{border-radius:2.2cqw;}
</style>
</head>

const AUDIO_CONFIG = {

/* ==================================================================
   DEFINITIONS — كل التعريفات في مكان واحد
   ================================================================== */
const DEFINITIONS = {
  // -------- المفردات الـ25 (من شرح المفردات) --------
  arfah:      { title:"الأَرْفَهُ", type:"مفردة", definition:"أَفْعَلُ تَفْضِيلٍ مِنْ رَفَهَ العَيْشُ: صَارَ رَغَداً لَيِّناً." },
  ashrar:     { title:"أَشْرَارٌ", type:"مفردة", definition:"لِئَامٌ يَتَّصِفُونَ بِالشَّرِّ." },
  adyaa:      { title:"أَضْيَعُ", type:"مفردة", definition:"أَفْعَلُ تَفْضِيلٍ مِنْ ضَاعَ / يَضِيعُ، بِمَعْنَى فَقَدَ." },
  aqwat:      { title:"أَقْوَاتٌ", type:"مفردة", definition:"جَمْعُ قُوتٍ: القَلِيلُ مِنَ الطَّعَامِ وَالرِّزْقِ." },
  iqnaa:      { title:"إِقْنَاعٌ", type:"مفردة", definition:"أَنْ يَعْرِضَ الإِنْسَانُ وِجْهَةَ نَظَرٍ بِأُسْلُوبٍ يُرْضِي الآخَرِينَ وَيُطْمَئِنُهُمْ." },
  aytam:      { title:"أَيْتَامٌ", type:"مفردة", definition:"جَمْعُ يَتِيمٍ، وَهُوَ الَّذِي فَقَدَ وَالِدَيْهِ أَوْ أَحَدَهُمَا." },
  tabaa:      { title:"تَابَعَ / يُتَابِعُ", type:"مفردة", definition:"وَالَى يُوَالِي، وَالمَقْصُودُ: اسْتَمَرَّ." },
  taawwud:    { title:"تَعَوَّضَ / يَتَعَوَّضُ", type:"مفردة", definition:"أَخْذُ العِوَضِ." },
  jarua:      { title:"جَرُؤَ / يَجْرُؤُ", type:"مفردة", definition:"شَجُعَ وَأَقْدَمَ." },
  hasina:     { title:"حَصِينَةٌ", type:"مفردة", definition:"مَنِيعَةٌ، وَدِرْعٌ حَصِينَةٌ: مُحْكَمَةٌ، وَالبَلْدَةُ الحَصِينَةُ: الَّتِي بُنِيَ حَوْلَهَا بِنَاءٌ قَوِيٌّ لِيَمْنَعَ عَنْهَا المُعْتَدِينَ." },
  hamasa:     { title:"حَمَاسَةٌ", type:"مفردة", definition:"الشَّجَاعَةُ." },
  khadhlan:   { title:"خَذْلَانٌ", type:"مفردة", definition:"تَرْكُ العَوْنِ وَالنَّصْرَةِ، وَالفِعْلُ: خَذَلَهُ يَخْذُلُهُ." },
  ruub:       { title:"رَعَبَ / يَرْعَبُ", type:"مفردة", definition:"الرُّعْبُ: الفَزَعُ وَالخَوْفُ." },
  rafaha:     { title:"رَفَهَ / يَرْفَهُ", type:"مفردة", definition:"عَاشَ فِي رَغَدٍ مِنَ العَيْشِ." },
  silaa:      { title:"السِّلْعَةُ", type:"مفردة", definition:"مَا يُشْتَرَى وَيُبَاعُ مِنَ الأَشْيَاءِ." },
  shawatee:   { title:"شَوَاطِئُ", type:"مفردة", definition:"جَمْعُ شَاطِئٍ، وَهُوَ الجُزْءُ مِنَ البَرِّ الَّذِي يَلِي النَّهْرَ أَوِ البَحْرَ." },
  taghiya:    { title:"الطَّاغِيَةُ", type:"مفردة", definition:"الظَّالِمُ الَّذِي كَثُرَ ظُلْمُهُ وَكِبْرُهُ." },
  iftaqara:   { title:"اِفْتَقَرَ / يَفْتَقِرُ", type:"مفردة", definition:"ضِدُّ: غَنِيَ / يَغْنَى." },
  liaam:      { title:"لِئَامٌ", type:"مفردة", definition:"أَشْرَارُ النَّاسِ، وَالمُفْرَدُ: لَئِيمٌ." },
  maduba:     { title:"مَأْدُبَةٌ", type:"مفردة", definition:"طَعَامٌ يُصْنَعُ لِدَعْوَةٍ أَوْ عُرْسٍ." },
  madiq:      { title:"مَضِيقٌ", type:"مفردة", definition:"مَا ضَاقَ مِنَ الأَمَاكِنِ، وَالمُرَادُ هُنَا: المَمَرُّ الضَّيِّقُ مِنَ البَحْرِ بَيْنَ بَرَّيْنِ، مِثْلُ مَضِيقِ جَبَلِ طَارِقٍ." },
  maniaa:     { title:"المَنِيعَةُ", type:"مفردة", definition:"الحَصِينَةُ، وَالفِعْلُ (مَنَعَ) كَكَرُمَ." },
  intakhaba:  { title:"اِنْتَخَبَ / يَنْتَخِبُ", type:"مفردة", definition:"اخْتَارَ." },

  huroub:     { title:"هُرُوبٌ", type:"مفردة", definition:"فِرَارٌ." },

  // -------- الصور البلاغية (من خصائص النص) --------
  ayna_almafar: { title:"أَيْنَ المَفَرُّ؟", type:"بلاغة", definition:"السُّؤَالُ هُنَا لَيْسَ حَقِيقِيّاً؛ لِأَنَّهُ لَا يَنْتَظِرُ مِنْهُمْ جَوَاباً، وَلٰكِنَّ مَعْنَاهُ النَّفْيُ، أَيْ: لَا مَفَرَّ لَكُمْ." },
  adyaa_quote:  { title:"أَضْيَعُ مِنَ الأَيْتَامِ فِي مَأْدُبَةِ اللِّئَامِ", type:"بلاغة", definition:"تَعْبِيرٌ يَدْعُو إِلَى اليَقَظَةِ وَالحِرْصِ؛ لِأَنَّ أَعْدَاءَهُمْ أَكْثَرُ لُؤْماً وَأَحْرَصُ عَلَى اسْتِغْلَالِهِمْ." },
  dhahabat_reeh:{ title:"ذَهَبَتْ رِيحُكُمْ", type:"بلاغة", definition:"تَعْبِيرٌ يُقْصَدُ بِهِ ذَهَابُ القُوَّةِ، فَإِذَا ذَهَبَتِ الرِّيحُ وَتَوَقَّفَتْ تَمَاماً، وَلَمْ يَجِدِ الإِنْسَانُ هَوَاءً يَتَنَفَّسُهُ، ضَعُفَ، وَأَدَّى بِهِ الضَّعْفُ إِلَى الهَلَاكِ." },
  alqat_madina: { title:"أَلْقَتْ بِهِ إِلَيْكُمْ مَدِينَتُهُ الحَصِينَةُ", type:"بلاغة", definition:"تَعْبِيرٌ يَدُلُّ عَلَى فَقْدِ القُوَّةِ وَالأَمَانِ وَالتَّعَرُّضِ لِلضَّعْفِ، فَإِلْقَاءُ هٰذِهِ المَدِينَةِ بِمَنْ فِيهَا بَعِيداً عَنْهَا يُفْقِدُهُمْ صِفَةَ القُوَّةِ، وَكَأَنَّهُمْ صَيْدٌ سَهْلٌ." },

  // -------- شخصيات وأماكن وأحداث ذُكرت في المادة --------
  tariq:      { title:"طَارِقُ بْنُ زِيَادٍ", type:"شخصية", definition:"طَارِقُ بْنُ زِيَادٍ اللَّيْثِيُّ (٥٠-١٠٢هـ / ٦٧٠-٧٢٠م)، انْتَخَبَهُ مُوسَى بْنُ نُصَيْرٍ لِقِيَادَةِ جَيْشِ المُسْلِمِينَ لِغَزْوِ الأَنْدَلُسِ، فَقَادَ الجَيْشَ قِيَادَةَ شَجَاعَةٍ حَتَّى تَمَكَّنَ مِنْ قَتْلِ مَلِكِ القُوطِ لُوذَرِيقَ، وَفَتَحَ طُلَيْطِلَةَ عَاصِمَةَ الأَنْدَلُسِ آنَذَاكَ." },
  musa:       { title:"مُوسَى بْنُ نُصَيْرٍ", type:"شخصية", definition:"كَانَ قَائِدُ المُسْلِمِينَ عَلَى شَمَالِ إِفْرِيقِيَا مِنْ قِبَلِ الوَلِيدِ بْنِ عَبْدِ المَلِكِ. رَحَّبَ بِعَرْضِ يُولِيَان، وَأَرْسَلَ أَوَّلَ جَيْشٍ سَنَةَ ٩١هـ، ثُمَّ أَرْسَلَ جَيْشَ طَارِقِ بْنِ زِيَادٍ سَنَةَ ٩٢هـ." },
  yulian:     { title:"يُولِيَان", type:"شخصية", definition:"حَاكِمُ «سَبْتَةَ»، شَجَّعَ عَلَى الفَتْحِ وَعَرَضَ أَنْ يُسَلِّمَ سَبْتَةَ وَيُسَاعِدَ عَلَى الفَتْحِ. وَقِيلَ إِنَّ سَبَبَ ذٰلِكَ هُوَ النِّزَاعُ الشَّدِيدُ بَيْنَهُ وَبَيْنَ لُوذَرِيقَ مَلِكِ القُوطِ." },
  luthariq:   { title:"لُوذَرِيقُ", type:"شخصية", definition:"مَلِكُ القُوطِ، أَعَدَّ جَيْشاً عَظِيماً قِيلَ إِنَّهُ بَلَغَ أَرْبَعِينَ أَلْفاً لِلِقَاءِ طَارِقٍ، وَانْتَهَتِ المَعْرَكَةُ بِانْتِصَارِ المُسْلِمِينَ عَلَيْهِ." },
  waleed:     { title:"الوَلِيدُ بْنُ عَبْدِ المَلِكِ", type:"شخصية", definition:"مَنْ كَانَ مُوسَى بْنُ نُصَيْرٍ قَائِداً مِنْ قِبَلِهِ. اسْتَدْعَى مُوسَى وَطَارِقاً بَعْدَ الخِلَافِ بَيْنَهُمَا، وَأَصْلَحَ بَيْنَهُمَا." },
  qut:        { title:"القُوطُ", type:"شخصية", definition:"القَوْمُ الَّذِينَ كَانُوا يَحْكُمُونَ الأَنْدَلُسَ قَبْلَ الفَتْحِ الإِسْلَامِيِّ، وَكَانَ مَلِكُهُمْ لُوذَرِيقَ. هُزِمُوا فِي مَعْرَكَةٍ كَبِيرَةٍ أَمَامَ جَيْشِ طَارِقٍ رَغْمَ أَنَّهُمْ كَانُوا أَكْثَرَ عَدَداً وَعُدَّةً." },
  sabta:      { title:"سَبْتَةُ", type:"مكان", definition:"المَدِينَةُ الَّتِي كَانَ يَحْكُمُهَا يُولِيَان، وَعَرَضَ تَسْلِيمَهَا وَالمُسَاعَدَةَ عَلَى فَتْحِ الأَنْدَلُسِ." },
  jabal_tariq:{ title:"جَبَلُ طَارِقٍ", type:"مكان", definition:"المَكَانُ الَّذِي نَزَلَ عَلَيْهِ طَارِقٌ بَعْدَ عُبُورِ المَضِيقِ عَلَى سُفُنِ يُولِيَان." },
  tulaytila:  { title:"طُلَيْطِلَةُ", type:"مكان", definition:"العَاصِمَةُ القُوطِيَّةُ، اتَّجَهَ إِلَيْهَا طَارِقٌ بِأَكْثَرِ الجَيْشِ فَدَخَلَهَا، وَأَسَّسَ فِيهَا دَوْلَةَ المُسْلِمِينَ فِي الأَنْدَلُسِ." },
  sharish:    { title:"شَرِيشُ", type:"مكان", definition:"سُهُولٌ قُرْبَ مَدِينَةِ قَادِسَ، الْتَقَى فِيهَا جَيْشُ طَارِقٍ بِجَيْشِ لُوذَرِيقَ فِي المَعْرَكَةِ الحَاسِمَةِ." },
  qadis:      { title:"قَادِسُ", type:"مكان", definition:"مَدِينَةٌ أَسْبَانِيَّةٌ قُرْبَ سُهُولِ شَرِيشَ، حَيْثُ دَارَتِ المَعْرَكَةُ الكُبْرَى بَيْنَ المُسْلِمِينَ وَالقُوطِ." },
  andalus:    { title:"الأَنْدَلُسُ", type:"مكان", definition:"شِبْهُ جَزِيرَةٍ تَقَعُ فِي الجَنُوبِ الغَرْبِيِّ مِنْ أُورُوبَّا، تَطُوفُ بِهَا المِيَاهُ مِنْ جَوَانِبِهَا إِلَّا مِنَ الشَّمَالِ الشَّرْقِيِّ. فَتَحَهَا المُسْلِمُونَ سَنَةَ ٩٢هـ / ٧١١م." },
  madiq_event:{ title:"عُبُورُ المَضِيقِ", type:"حدث", definition:"عَبَرَ طَارِقٌ بِجَيْشِهِ الَّذِي بَلَغَ اثْنَيْ عَشَرَ أَلْفَ مُقَاتِلٍ المَضِيقَ الَّذِي سُمِّيَ فِيمَا بَعْدُ بِاسْمِهِ، عَلَى سُفُنِ يُولِيَان، وَنَزَلَ عَلَى جَبَلِ طَارِقٍ." },
  ships_event:{ title:"إِحْرَاقُ السُّفُنِ", type:"حدث", definition:"نُسِبَ إِلَى طَارِقٍ أَنَّهُ أَحْرَقَ السُّفُنَ الَّتِي عَبَرَ بِهَا إِلَى الشَّاطِئِ الأَنْدَلُسِيِّ، حَتَّى لَا يَجِدَ جُنْدُهُ أَمَامَهُمْ سَبِيلاً إِلَّا قِتَالَ عَدُوِّهِمْ وَالاِنْتِصَارَ عَلَيْهِ." },
  khutba_event:{ title:"الخُطْبَةُ", type:"حدث", definition:"قِيلَ: إِنَّ طَارِقاً خَطَبَ فِي جُيُوشِهِ خُطْبَةً أَثَارَتْ مَشَاعِرَهُمْ، وَأَشْعَلَتْ حَمَاسَتَهُمْ، فَتَمَكَّنُوا مِنَ الاِنْتِصَارِ عَلَى أَعْدَائِهِمْ مِنَ القُوطِ الَّذِينَ كَانُوا أَكْثَرَ مِنْهُمْ عَدَداً وَعُدَّةً. وَقَدْ نُسِبَتْ هٰذِهِ الخُطْبَةُ إِلَى طَارِقِ بْنِ زِيَادٍ." },

  }
  return h;
})();

}
