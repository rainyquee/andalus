/* ==================================================================
   STATE + ELEMENTS
   ================================================================== */
const state = { currentSlide:0, isTransitioning:false, isModalOpen:false, isGridOpen:false, isPresenter:false, isPlaying:false, isFullscreen:false, ts:1 };
const els = {};
["startScreen","startBtn","startBg","stRoute","slideHost","controls","btnPrev","btnNext","btnMusic","btnFullscreen","btnTsUp","btnTsDown","btnGrid","btnPresent","slideCounter","modalLayer","modalCard","modalType","modalTitle","modalBody","modalClose","termHint","debugOverlay","canvas","gridLayer","gridBody","gridClose","route","rtFill","rtMark","pbarFill","pmini","fx"].forEach(function(id){ els[id] = document.getElementById(id); });
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- adaptive performance tier ----------
   level 0 = full · 1 = lite (no backdrop blur, compositor-only transitions, fewer particles)
   level 2 = weak device (also static background, particles off). Only ever steps DOWN. */
const root = document.documentElement;
const isCoarse = window.matchMedia("(pointer:coarse)").matches;
const perf = { level:0 };
let started = false;
(function(){
  const mem = navigator.deviceMemory || 8, cores = navigator.hardwareConcurrency || 8;
  const cn = navigator.connection, save = !!(cn && cn.saveData);
  let l = 0;
  if(mem <= 4 || (isCoarse && cores <= 6)) l = 1;
  if(save || mem <= 1 || cores <= 2) l = 2;
  perf.level = l;
  root.classList.toggle("lite", l >= 1);
  root.classList.toggle("lite2", l >= 2);
})();
function setPerf(l){
  if(l <= perf.level) return;
  perf.level = l;
  root.classList.add("lite");
  root.classList.toggle("lite2", l >= 2);
  Particles.setLevel();
}
/* samples frame times during a transition; two slow transitions in a row -> step down a tier */
let slowRuns = 0, probeId = 0, navCount = 0;
function probe(ms){
  if(perf.level >= 2 || document.hidden) return;
  const id = ++probeId; let first = 0, last = 0, n = 0, sum = 0;
  requestAnimationFrame(function tick(t){
    if(id !== probeId) return;
    if(!first) first = t; else { const d = t - last; if(d < 400){ sum += d; n++; } }
    last = t;
    if(t - first < ms){ requestAnimationFrame(tick); return; }
    if(n > 10 && sum/n > 30){ if(++slowRuns >= 2){ slowRuns = 0; setPerf(perf.level + 1); } } else slowRuns = 0;
  });
}
const idle = window.requestIdleCallback ? function(fn){ requestIdleCallback(fn,{timeout:1500}); } : function(fn){ setTimeout(fn,250); };
document.addEventListener("visibilitychange", function(){ root.classList.toggle("is-paused", document.hidden); });

const ARABIC_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toArabicNum(n){ return String(n).split("").map(d=>ARABIC_DIGITS[+d] || d).join(""); }

/* card width (cqw), image blur (px), and side (r = right, l = left) per slide */
const LAY = {
  qail:{w:54,b:0,s:"r"}, nassA:{w:90,b:6}, nassBC:{w:90,b:6},
  khas12:{w:90,b:6}, khas34:{w:90,b:5}, thanks:{w:54,b:2,s:"l"}
};
const ROUTE_LABELS = ["قَائِلُ النَّصِّ","النَّصُّ ( أ )","النَّصُّ ( ب ، ج )","الخَصَائِصُ ١ - ٢","الخَصَائِصُ ٣ - ٤","شُكْرٌ وَتَقْدِيرٌ"];

/* ==================================================================
   BUILD SLIDES (pre-rendered, hidden)
   ================================================================== */
const slideEls = [], assetKeys = [];
function buildSlides(){
  const frag = document.createDocumentFragment();
  SLIDES.forEach((s, i)=>{
    const el = document.createElement("div");
    const L = LAY[s.id] || {};
    el.className = "slide " + (s.cls||"") + (L.wide ? " lay-wide" : "") + " tr-" + s.transition;
    el.dataset.index = i;
    el.dataset.id = s.id;
    el.style.setProperty("--cw", (L.w||80)+"cqw");
    el.style.setProperty("--bb", (L.b||5)+"px");
    if(L.s) el.style.setProperty("--jc", L.s==="r" ? "flex-start" : "flex-end");
    const bg = s.bg();
    const m = /data-asset="(\w+)"/.exec(bg);
    assetKeys[i] = m && m[1];
    el.innerHTML = bg + s.body();
    frag.appendChild(el);
    slideEls.push(el);
  });
  els.slideHost.appendChild(frag);
  els.startBg.innerHTML = bgHTML("hero",{drift:false});
  els.stRoute.innerHTML = ["قَائِلُ النَّصِّ","النَّصُّ","الخَصَائِصُ"].map(t=>"<span>"+t+"</span>").join("<i>←</i>");
  els.route.insertAdjacentHTML("beforeend", ROUTE_LABELS.map((t,j)=>'<button class="rt-node" data-s="'+j+'" aria-label="'+t+'"><i></i><span>'+t+'</span></button>').join(""));
  updateUI(0);
}

/* Lazy / preload image loading with graceful fallback.
   Single request (no probe Image), async decode, fade in only once decoded. */
function loadImgIn(el, hi){
  const img = el && el.querySelector(".slide-bg img");
  if(!img || img.dataset.loaded) return;
  img.dataset.loaded = "1";
  img.decoding = "async";
  if(hi) img.fetchPriority = "high";
  const show = ()=>{ img.classList.add("is-loaded"); };
  img.onload = ()=>{ if(img.decode){ img.decode().then(show, show); } else show(); };
  img.onerror = ()=>{ if(DEBUG) markAssetMissing(el.dataset.id || "start"); };
  img.src = img.getAttribute("data-src");
}
function loadLz(el){
  if(!el) return;
  el.querySelectorAll("img.lz[data-src]").forEach(function(im){
    im.onload = function(){ im.classList.add("on"); };
    im.src = im.getAttribute("data-src");
    im.removeAttribute("data-src");
  });
}
function loadSlideImages(index){ loadImgIn(slideEls[index]); loadLz(slideEls[index]); }
function preloadNeighbors(index){
  loadSlideImages(index);
  if(index+1 < SLIDES.length) loadSlideImages(index+1);
  idle(function(){
    if(index-1 >= 0) loadSlideImages(index-1);
    if(perf.level < 1 && index+2 < SLIDES.length) loadSlideImages(index+2);
    if(perf.level >= 1) releaseFar(index);
  });
}
/* lite tiers: free decoded bitmaps of slides far from the current one */
function releaseFar(index){
  slideEls.forEach((el,i)=>{
    if(Math.abs(i-index) <= 3) return;
    const img = el.querySelector(".slide-bg img");
    if(img && img.dataset.loaded && img.getAttribute("src")){
      img.classList.remove("is-loaded"); img.removeAttribute("src"); delete img.dataset.loaded;
    }
  });
}

/* ==================================================================
   UI: counter, progress bar, route
   ================================================================== */
let curBg = null, rtNodes = null;
function updateUI(i){
  const n = SLIDES.length;
  const label = toArabicNum(i+1) + " / " + toArabicNum(n);
  els.slideCounter.textContent = label;
  els.pmini.textContent = label;
  els.pbarFill.style.transform = "scaleX(" + (i/(n-1)) + ")";
  const pos = Math.max(0, Math.min(1, i/(n-1)));
  els.rtFill.style.transform = "scaleX(" + pos + ")";
  /* track is 66cqw wide (78cqw route − 2×6cqw); move by transform, not `right` */
  els.rtMark.style.transform = "translate(calc(50% - " + (pos*66).toFixed(3) + "cqw),-50%) rotate(45deg)";
  if(!rtNodes) rtNodes = els.route.querySelectorAll(".rt-node");
  rtNodes.forEach((nd,j)=>{
    nd.classList.toggle("is-on", i >= j);
    nd.classList.toggle("is-cur", i === j);
  });
  curBg = slideEls[i] ? slideEls[i].querySelector(".slide-bg") : null;
  lastPx = lastPy = 9; /* force next parallax write */
}

/* ==================================================================
   SYNC — slide ikut berpindah di semua perangkat (server.js, port 3001)
   ================================================================== */
const Sync = (function(){
  const cid = Math.random().toString(36).slice(2);
  let target = null, applying = false, es = null;
  function local(i){
    if(applying) return;
    try{ fetch("/api/slide", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({i:i, cid:cid}), keepalive:true}).catch(()=>{}); }catch(e){}
  }
  function def(key){
    if(applying) return;
    try{ fetch("/api/def", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({def:key, cid:cid}), keepalive:true}).catch(()=>{}); }catch(e){}
  }
  function applyDef(key){
    if(!started) return;
    applying = true;
    try{
      if(key === null){ if(state.isModalOpen) closeDefinition(); }
      else if(DEFINITIONS[key]) openDefinition(key);
    }finally{ applying = false; }
  }
  function music(on){
    if(applying) return;
    try{ fetch("/api/music", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({on:!!on, cid:cid}), keepalive:true}).catch(()=>{}); }catch(e){}
  }
  function applyMusic(on){
    if(!started) return;
    applying = true;
    try{ if(on) AudioCtl.play(); else AudioCtl.pause(); }finally{ applying = false; }
  }
  function terms(){   /* kirim daftar kata (data-def) tiap slide ke server, untuk remote */
    try{
      const out = slideEls.map(function(el){
        const seen = {}, list = [];
        el.querySelectorAll("[data-def]").forEach(function(n){
          const k = n.getAttribute("data-def"), d = DEFINITIONS[k];
          if(seen[k] || !d) return;
          seen[k] = 1; list.push({k:k, w:n.textContent, t:d.title, y:d.type, d:d.definition});
        });
        return list;
      });
      fetch("/api/terms", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({terms:out, cid:cid}), keepalive:true}).catch(()=>{});
    }catch(e){}
  }
  function apply(){
    if(target === null || !started) return;
    if(state.isTransitioning){ setTimeout(apply, 120); return; }
    const i = target;
    if(i !== state.currentSlide && i >= 0 && i < SLIDES.length){
      applying = true;
      try{ goTo(i); }finally{ applying = false; }
      setTimeout(apply, 120);       /* kalau ada perintah baru saat animasi, kejar lagi */
    }else if(i === target){ target = null; }
  }
  function connect(){
    if(!window.EventSource) return;
    es = new EventSource("/events?cid=" + cid);
    es.onopen = function(){ if(started) terms(); };   /* server restart / tersambung ulang: kirim ulang daftar kata */
    es.onmessage = function(e){
      try{
        const d = JSON.parse(e.data);
        if(typeof d.i === "number"){ target = d.i; apply(); }
        else if("def" in d){ applyDef(d.def); }
        else if("music" in d){ applyMusic(d.music); }
      }catch(err){}
    };
  }
  connect();
  return { local:local, def:def, music:music, terms:terms, ready:apply };
})();

/* ==================================================================
   NAVIGATION
   ================================================================== */
let navTimer = 0;
function goTo(index, dir){
  if(state.isTransitioning) return;
  if(index < 0 || index >= SLIDES.length) return;
  if(index === state.currentSlide) return;
  Sync.local(index);

  const from = slideEls[state.currentSlide];
  const to = slideEls[index];
  const d = index > state.currentSlide ? 1 : -1;
  state.isTransitioning = true;
  if(navCount++ > 0) probe(950);

  [to, from].forEach(el=>{
    el.style.setProperty("--d", d);
    el.style.setProperty("--w0", d>0 ? "inset(0 100% 0 0)" : "inset(0 0 0 100%)");
  });
  loadSlideImages(index);
  from.classList.remove("is-settled");
  to.classList.remove("is-settled");
  to.classList.add("is-active");
  from.classList.add("is-leaving");

  let done = 0;
  const cleanup = ()=>{
    clearTimeout(navTimer);
    to.removeEventListener("animationend", onEnd);
    from.removeEventListener("animationend", onEnd);
    from.classList.remove("is-active","is-leaving","is-settled");
    to.classList.remove("is-leaving");
    to.classList.add("is-settled");           /* drop the filled animation -> frees the slide's compositor layer */
    const fb = from.querySelector(".slide-bg"); if(fb) fb.style.transform = "";
    state.currentSlide = index;
    state.isTransitioning = false;
    updateUI(index);
    preloadNeighbors(index);
    updateDebug();
  };
  const onEnd = (e)=>{
    if(e.target !== to && e.target !== from) return;
    if(++done >= 2) cleanup();
  };
  to.addEventListener("animationend", onEnd);
  from.addEventListener("animationend", onEnd);
  // safety fallback in case one animation event doesn't fire
  navTimer = setTimeout(()=>{ if(state.isTransitioning) cleanup(); }, 1400);
}

function next(){ goTo(state.currentSlide+1, 1); }
function prev(){ goTo(state.currentSlide-1, -1); }

/* ==================================================================
   AUDIO CONTROLLER
   ================================================================== */
const AudioCtl = (function(){
  let audio = null;
  let enabled = true;
  function ensure(){
    if(audio) return audio;
    audio = new Audio();
    audio.src = AUDIO_CONFIG.src;
    audio.loop = AUDIO_CONFIG.loop;
    audio.volume = AUDIO_CONFIG.volume;
    audio.preload = "auto";
    audio.addEventListener("error", ()=>{ if(DEBUG) console.warn("تعذّر تحميل الموسيقى"); });
    return audio;
  }
  function play(){
    try{
      const a = ensure();
      const p = a.play();
      if(p && p.catch) p.catch(()=>{ /* منع التشغيل التلقائي من المتصفح، سيُحاول لاحقاً بتفاعل المستخدم */ });
      state.isPlaying = true;
      updateMusicBtn();
      Sync.music(true);
    }catch(err){ if(DEBUG) console.warn(err); }
  }
  function pause(){
    try{ if(audio) audio.pause(); }catch(err){}
    state.isPlaying = false;
    updateMusicBtn();
    Sync.music(false);
  }
  function toggle(){
    if(!enabled) return;
    if(state.isPlaying) pause(); else play();
  }
  return { play, pause, toggle };
})();

function updateMusicBtn(){
  els.btnMusic.classList.toggle("is-off", !state.isPlaying);
}


/* ==================================================================
   BOTTOM SHEET / DEFINITIONS
   ================================================================== */
function syncOv(){
  document.body.classList.toggle("ov", state.isModalOpen || state.isGridOpen);
  Particles.hold(state.isGridOpen);
}
function openDefinition(key){
  const def = DEFINITIONS[key];
  if(!def) return;
  Sync.def(key);
  els.modalType.textContent = def.type;
  els.modalTitle.textContent = def.title;
  els.modalBody.textContent = def.definition;
  els.modalCard.scrollTop = 0;
  els.modalLayer.classList.add("is-open");
  state.isModalOpen = true;
  syncOv();
  try{ els.modalClose.focus({preventScroll:true}); }catch(err){}
  updateDebug();
}
function closeDefinition(){
  Sync.def(null);
  els.modalLayer.classList.remove("is-open");
  state.isModalOpen = false;
  syncOv();
  updateDebug();
}

let hintShown = false;
function onHintHover(e){
  if(e.target.closest && e.target.closest(".term, .vocab-pill, .rhet-card")) maybeShowHint();
}
function maybeShowHint(){
  if(hintShown) return;
  hintShown = true;
  document.removeEventListener("pointerover", onHintHover);
  els.slideHost.removeEventListener("click", onHintHover);
  els.termHint.classList.add("is-on");
  setTimeout(()=>{ els.termHint.classList.remove("is-on"); }, 3200);
}

/* ==================================================================
   SLIDE GRID
   ================================================================== */
function fillThumbs(){
  const cur = state.currentSlide;
  const order = SLIDES.map((_,i)=>i).sort((a,b)=>Math.abs(a-cur)-Math.abs(b-cur));
  let k = 0;
  (function step(){
    if(k >= order.length) return;
    const el = els.gridBody.children[order[k++]];
    const d = el && el.querySelector(".th-img");
    if(d && d.dataset.bg){ d.style.backgroundImage = "url('" + d.dataset.bg + "')"; delete d.dataset.bg; }
    setTimeout(step, perf.level ? 80 : 40);
  })();
}
function buildGrid(){
  if(els.gridBody.children.length) return;
  const frag = document.createDocumentFragment();
  SLIDES.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "thumb"; b.dataset.i = i;
    const h = slideEls[i].querySelector("h2,h1,.speech-label");
    b.innerHTML = '<div class="th-img"'+(assetKeys[i] ? ' data-bg="'+ASSETS[assetKeys[i]]+'"' : '')+'></div><span class="th-n">'+toArabicNum(i+1)+'</span><span class="th-t"></span>';
    b.querySelector(".th-t").textContent = h ? h.textContent : "";
    frag.appendChild(b);
  });
  els.gridBody.appendChild(frag);
  fillThumbs();
}
function openGrid(){
  buildGrid();
  const kids = els.gridBody.children;
  for(let i=0;i<kids.length;i++) kids[i].classList.toggle("is-cur", i===state.currentSlide);
  els.gridLayer.classList.add("is-open");
  state.isGridOpen = true;
  syncOv();
}
function closeGrid(){ els.gridLayer.classList.remove("is-open"); state.isGridOpen = false; syncOv(); }

/* ==================================================================
   TEXT SIZE + PRESENTER MODE
   ================================================================== */
function applyTS(){ els.canvas.style.setProperty("--ts", (state.ts * (state.isPresenter ? 1.1 : 1)).toFixed(2)); }
function changeTS(delta){
  state.ts = Math.max(.8, Math.min(1.5, Math.round((state.ts+delta)*10)/10));
  applyTS();
}
function togglePresenter(force){
  state.isPresenter = force === undefined ? !state.isPresenter : force;
  document.body.classList.toggle("presenter", state.isPresenter);
  applyTS();
  if(!state.isPresenter) showControls(true);
}

/* ==================================================================
   EVENTS
   ================================================================== */
document.addEventListener("click", function(e){
  const termEl = e.target.closest("[data-def]");
  if(termEl){
    e.stopPropagation();
    openDefinition(termEl.getAttribute("data-def"));
    return;
  }
  if(e.target === els.modalLayer){ closeDefinition(); }
  if(e.target === els.gridLayer){ closeGrid(); }
  const th = e.target.closest(".thumb");
  if(th){ const i = +th.dataset.i; closeGrid(); setTimeout(()=>goTo(i), 220); return; }
  const rn = e.target.closest(".rt-node");
  if(rn){ goTo(+rn.dataset.s); }
});
els.modalClose.addEventListener("click", closeDefinition);
els.gridClose.addEventListener("click", closeGrid);
document.addEventListener("pointerover", onHintHover, {passive:true});
els.slideHost.addEventListener("click", onHintHover);

/* vocab tabs */
els.slideHost.addEventListener("click", function(e){
  const tab = e.target.closest(".vocab-tab");
  if(!tab) return;
  const scope = tab.closest(".slide-body");
  const idx = tab.getAttribute("data-vg");
  scope.querySelectorAll(".vocab-tab").forEach(t=>t.classList.toggle("is-on", t===tab));
  scope.querySelectorAll(".vocab-item").forEach(it=>it.classList.toggle("is-on", it.getAttribute("data-vgi")===idx));
});

els.btnNext.addEventListener("click", next);
els.btnPrev.addEventListener("click", prev);
els.btnMusic.addEventListener("click", ()=>AudioCtl.toggle());
els.btnFullscreen.addEventListener("click", toggleFullscreen);
els.btnTsUp.addEventListener("click", ()=>changeTS(.1));
els.btnTsDown.addEventListener("click", ()=>changeTS(-.1));
els.btnGrid.addEventListener("click", openGrid);
els.btnPresent.addEventListener("click", ()=>togglePresenter(true));
els.pmini.addEventListener("click", ()=>togglePresenter(false));

document.addEventListener("keydown", function(e){
  const ae = document.activeElement;
  const onTerm = ae && ae.hasAttribute && ae.hasAttribute("data-def");
  if((e.key === "Enter" || e.key === " ") && onTerm){
    e.preventDefault();
    openDefinition(ae.getAttribute("data-def"));
    return;
  }
  if(e.key === "m" || e.key === "M"){ AudioCtl.toggle(); return; }
  if(!document.body.classList.contains("started")){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); els.startBtn.click(); }
    return;
  }
  if(state.isModalOpen){
    if(e.key === "Escape") closeDefinition();
    return;
  }
  if(state.isGridOpen){
    if(e.key === "Escape" || e.key === "g" || e.key === "G") closeGrid();
    return;
  }
  switch(e.key){
    case "ArrowRight": next(); break;
    case "ArrowLeft": prev(); break;
    case " ": e.preventDefault(); next(); break;
    case "Enter":
      if(!(ae && ae.tagName === "BUTTON")) next();
      break;
    case "Home": goTo(0); break;
    case "End": goTo(SLIDES.length-1); break;
    case "Escape":
      if(state.isPresenter) togglePresenter(false);
      else if(state.isFullscreen) exitFullscreen();
      break;
    case "f": case "F": toggleFullscreen(); break;
    case "p": case "P": togglePresenter(); break;
    case "g": case "G": openGrid(); break;
    case "+": case "=": changeTS(.1); break;
    case "-": case "_": changeTS(-.1); break;
  }
});

/* touch swipe (slides) + swipe-down (sheet) */
let touchX = null, touchY = null;
els.canvas.addEventListener("touchstart", function(e){
  if(e.target.closest("[data-def], #controls, #route, #pmini, #modalLayer, #gridLayer, .vocab-tab")) { touchX = null; return; }
  const t = e.changedTouches[0];
  touchX = t.clientX; touchY = t.clientY;
}, {passive:true});
els.canvas.addEventListener("touchend", function(e){
  if(touchX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX;
  const dy = t.clientY - touchY;
  touchX = null;
  if(Math.abs(dx) < 46 || Math.abs(dx) < Math.abs(dy)*1.3) return;
  if(dx < 0) next(); else prev();
}, {passive:true});
let sheetY = null;
els.modalCard.addEventListener("touchstart", function(e){ sheetY = e.changedTouches[0].clientY; }, {passive:true});
els.modalCard.addEventListener("touchend", function(e){
  if(sheetY !== null && e.changedTouches[0].clientY - sheetY > 80 && els.modalCard.scrollTop <= 0) closeDefinition();
  sheetY = null;
}, {passive:true});

/* auto-hide controls (timer reset is throttled — pointermove fires very often) */
let hideTimer = 0, lastShow = 0;
function showControls(force){
  if(state.isPresenter) return;
  const now = performance.now();
  if(!force && now - lastShow < 250 && !els.controls.classList.contains("is-dim")) return;
  lastShow = now;
  els.controls.classList.remove("is-dim");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=>{ if(!state.isModalOpen && !state.isGridOpen) els.controls.classList.add("is-dim"); }, 3600);
}
["pointermove","pointerdown"].forEach(ev=>{
  document.addEventListener(ev, ()=>showControls(), {passive:true});
});

/* very subtle parallax: pointer only, one rAF write per frame, cached rect, skipped when idle/overlay/weak device */
let px = 0, py = 0, lastPx = 9, lastPy = 9, rafP = 0, canvasRect = null;
function applyParallax(){
  rafP = 0;
  if(!curBg) return;
  if(Math.abs(px-lastPx) < .012 && Math.abs(py-lastPy) < .012) return;
  lastPx = px; lastPy = py;
  curBg.style.transform = "translate3d("+(px*-2).toFixed(2)+"cqw,"+(py*-1.4).toFixed(2)+"cqw,0)";
}
els.canvas.addEventListener("pointermove", function(e){
  if(reduceMotion || perf.level >= 2 || !started || e.pointerType === "touch" || state.isModalOpen || state.isGridOpen) return;
  if(!canvasRect) canvasRect = els.canvas.getBoundingClientRect();
  px = (e.clientX - canvasRect.left)/canvasRect.width - .5;
  py = (e.clientY - canvasRect.top)/canvasRect.height - .5;
  if(!rafP) rafP = requestAnimationFrame(applyParallax);
}, {passive:true});

/* one debounced resize path: invalidates cached rect + resizes particle canvas */
let resizeT = 0;
function onResize(){
  canvasRect = null;
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>Particles.resize(), 160);
}
if(window.ResizeObserver) new ResizeObserver(onResize).observe(els.canvas);
else window.addEventListener("resize", onResize);

/* ==================================================================
   FULLSCREEN
   ================================================================== */
function toggleFullscreen(){
  if(!document.fullscreenElement) requestFullscreen(); else exitFullscreen();
}
function requestFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req) { try{ req.call(el); }catch(err){} }
}
function exitFullscreen(){
  const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(ex) { try{ ex.call(document); }catch(err){} }
}
document.addEventListener("fullscreenchange", ()=>{
  state.isFullscreen = !!document.fullscreenElement;
});

/* ==================================================================
   START
   ================================================================== */
els.startBtn.addEventListener("click", function(){
  if(started) return;
  started = true;
  document.body.classList.add("started");
  els.startScreen.classList.add("is-hidden");
  slideEls[0].classList.add("is-active");
  preloadNeighbors(0);
  AudioCtl.play();
  showControls(true);
  updateUI(0);
  updateDebug();
  Sync.ready();
  Sync.terms();
  /* once the intro has faded out, remove it from rendering entirely (frees its blurred image layer) */
  setTimeout(()=>{ els.startScreen.style.display = "none"; els.startBg.textContent = ""; }, 1000);
  setTimeout(()=>{ if(state.currentSlide === 0 && !state.isTransitioning) slideEls[0].classList.add("is-settled"); }, 1250);
});

/* ==================================================================
   DUST / LIGHT PARTICLES — few sprites, time-based, stops when hidden/covered
   ================================================================== */
const Particles = (function(){
  const c = els.fx, x = c.getContext("2d");
  let W = 1, H = 1, last = 0, raf = 0, running = false, held = false, N = 0, gap = 33, dprCap = 1.5;
  const P = [];
  const spr = document.createElement("canvas");
  spr.width = spr.height = 32;
  const g = spr.getContext("2d"), gr = g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.4,"rgba(208,87,85,.45)"); gr.addColorStop(1,"rgba(208,87,85,0)");
  g.fillStyle = gr; g.fillRect(0,0,32,32);

  function reset(q, init){
    q.x = Math.random()*W; q.y = init ? Math.random()*H : H+20;
    q.s = (4+Math.random()*14)*(W/1280); q.v = .15+Math.random()*.4;
    q.a = .12+Math.random()*.38; q.p = Math.random()*6.28; q.w = .3+Math.random()*.7;
    return q;
  }
  function config(){
    const l = perf.level;
    N = (reduceMotion || l >= 2) ? 0 : (l === 1 ? 9 : (isCoarse ? 14 : 22));
    gap = l === 1 ? 42 : 33;
    dprCap = l >= 1 ? 1 : 1.5;
  }
  function size(){
    const r = els.canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1, dprCap);
    W = c.width = Math.max(1, Math.round(r.width*d)); H = c.height = Math.max(1, Math.round(r.height*d));
    P.length = 0;
    for(let i=0;i<N;i++) P.push(reset({}, true));
  }
  function frame(t){
    raf = requestAnimationFrame(frame);
    const dt = t - last;
    if(dt < gap) return;
    last = t;
    const f = Math.min(dt, 100)/33, k = (W/1280)*f;
    x.clearRect(0,0,W,H);
    for(let i=0;i<P.length;i++){
      const q = P[i];
      q.y -= q.v*k;
      q.x += Math.sin(t/1800+q.p)*.25*q.w*f;
      if(q.y < -20) reset(q,false);
      x.globalAlpha = q.a*(.55+.45*Math.sin(t/900+q.p));
      x.drawImage(spr, q.x, q.y, q.s, q.s);
    }
  }
  function start(){ if(running || N === 0 || held || document.hidden) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
  function stop(){ running = false; cancelAnimationFrame(raf); }
  function apply(){
    stop(); config();
    if(N === 0){ c.style.display = "none"; return; }
    c.style.display = ""; size(); start();
  }
  document.addEventListener("visibilitychange", function(){ if(document.hidden) stop(); else start(); });
  apply();
  return {
    setLevel: apply,
    resize: function(){ if(N){ size(); } },
    hold: function(b){ held = !!b; if(held) stop(); else start(); }
  };
})();

/* ==================================================================
   DEBUG MODE
   ================================================================== */
const missingAssets = new Set();
function markAssetMissing(id){ missingAssets.add(id); updateDebug(); }
function updateDebug(){
  if(!DEBUG) return;
  els.debugOverlay.classList.add("is-on");
  const s = SLIDES[state.currentSlide];
  els.debugOverlay.textContent =
    "slide: " + s.id + " (" + (state.currentSlide+1) + "/" + SLIDES.length + ")\n" +
    "transition: " + s.transition + "\n" +
    "modal: " + state.isModalOpen + "\n" +
    "playing: " + state.isPlaying + "\n" +
    "fullscreen: " + state.isFullscreen + "\n" +
    "missing assets: " + (Array.from(missingAssets).join(", ") || "—");
}

/* ==================================================================
   GLOBAL ERROR SAFETY NET
   ================================================================== */
window.addEventListener("error", function(e){
  if(DEBUG) console.warn("خطأ غير متوقع:", e.message);
});
window.addEventListener("unhandledrejection", function(e){
  if(DEBUG) console.warn("خطأ Promise:", e.reason);
});

/* ==================================================================
   INIT
   ================================================================== */
buildSlides();
loadImgIn(els.startBg, true);
updateDebug();

})();
</script>
